[package]
name = "the-wall-backend"
version = "6.2.4"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", features = ["json", "multipart"] }
url = "2"
dotenvy = "0.15"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
webp = "0.3"
ed25519-dalek = "2"
hex = "0.4"
# Discord gateway (presence + interaction fallback) — see discord_gateway.rs.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
# Blocking client keeps the smoke tests free of async scaffolding.
reqwest = { version = "0.13", features = ["json", "blocking"] }

# Integration tests live at the repo root (tests/backend/) so frontend and
# backend suites sit side by side; cargo needs explicit targets for that.
[[test]]
name = "env_contract"
path = "../tests/backend/env_contract.rs"

[[test]]
name = "api_smoke"
path = "../tests/backend/api_smoke.rs"
