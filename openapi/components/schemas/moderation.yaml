Report:
  type: object
  required:
    - id
    - type
    - targetId
    - targetType
    - reporterId
    - reporterUsername
    - reason
    - status
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique report identifier.
    type:
      type: string
      enum:
        - template
        - message
        - user
        - clan
      description: Type of reported content.
    targetId:
      type: string
      description: Identifier of the reported entity.
    targetType:
      type: string
      description: Entity type of the target (e.g. "template", "message").
    reporterId:
      type: string
      format: uuid
      description: Account UUID of the reporter.
    reporterUsername:
      type: string
      description: Username of the reporter.
    reason:
      type: string
      description: Reporter-provided reason.
    evidence:
      type: string
      nullable: true
      description: Optional evidence provided by the reporter (URL, text, etc.).
    status:
      type: string
      enum:
        - open
        - reviewing
        - resolved
        - dismissed
      description: Current report status.
    assignedModId:
      type: string
      format: uuid
      nullable: true
      description: Account UUID of the moderator assigned to review this report.
    resolution:
      type: string
      nullable: true
      description: Final resolution summary when resolved.
    createdAt:
      type: string
      format: date-time
      description: Timestamp when the report was created.
    updatedAt:
      type: string
      format: date-time
      description: Timestamp of the last update.

ReportPage:
  allOf:
    - $ref: "./moderation.yaml#/Report"
    - $ref: "./common.yaml#/Pagination"

ReportCreate:
  type: object
  required:
    - reason
  properties:
    reason:
      type: string
      minLength: 10
      maxLength: 2000
      description: Reporter-provided reason for the report.
    evidence:
      type: string
      maxLength: 5000
      description: Optional evidence (URL, description of issue, etc.).

ReportUpdate:
  type: object
  properties:
    status:
      type: string
      enum:
        - open
        - reviewing
        - resolved
        - dismissed
      description: Updated report status.
    assignedModId:
      type: string
      format: uuid
      description: Account UUID of the moderator to assign this report to.
    notes:
      type: string
      maxLength: 1000
      description: Internal moderator notes.

ReportResolve:
  type: object
  required:
    - resolution
  properties:
    resolution:
      type: string
      enum:
        - content_removed
        - no_action_needed
        - user_warned
        - user_restricted
        - other
      description: Resolution action taken.
    notes:
      type: string
      maxLength: 1000
      description: Additional notes about the resolution.
    createRestriction:
      type: boolean
      default: false
      description: Whether to automatically create a restriction as part of resolution.

ReportDismiss:
  type: object
  properties:
    reason:
      type: string
      enum:
        - duplicate
        - false_report
        - not_actionable
        - other
      description: Reason for dismissing the report.

ModAction:
  type: object
  properties:
    notes:
      type: string
      maxLength: 1000
      description: Notes about the moderation action.

AuditLogEntry:
  type: object
  required:
    - id
    - moderatorId
    - moderatorUsername
    - action
    - targetType
    - targetId
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique audit log entry identifier.
    moderatorId:
      type: string
      format: uuid
      description: Account UUID of the moderator who performed the action.
    moderatorUsername:
      type: string
      description: Username of the moderator.
    action:
      type: string
      description: Action performed (e.g. "ban", "mute", "template_approved").
    targetType:
      type: string
      description: Type of entity acted upon.
    targetId:
      type: string
      description: Identifier of the entity acted upon.
    details:
      type: object
      nullable: true
      description: Additional action-specific details.
    createdAt:
      type: string
      format: date-time
      description: Timestamp of the action.

AuditLogPage:
  allOf:
    - $ref: "./moderation.yaml#/AuditLogEntry"
    - $ref: "./common.yaml#/Pagination"

ClanTakedownRequest:
  type: object
  required:
    - fields
    - reason
  description: |
    Request body for a global-moderator clan takedown. Strips (and optionally locks)
    one or more presentation fields on the targeted clan. Never deletes the clan itself.
  properties:
    fields:
      type: array
      minItems: 1
      description: Presentation fields to act upon. At least one field is required.
      items:
        $ref: "./clans.yaml#/ClanLockableField"
    action:
      type: string
      enum:
        - strip
        - strip_and_lock
      default: strip_and_lock
      description: |
        - `strip` — clears the field value immediately; the clan can set it again.
        - `strip_and_lock` (default) — clears the value and prevents clan-level roles
          from modifying it until a global moderator calls the unlock endpoint.
    reason:
      type: string
      maxLength: 1000
      description: Mandatory moderator-supplied reason, recorded in the audit log and surfaced to clan leadership.

ClanUnlockRequest:
  type: object
  description: Request body to remove a global-moderation field lock from a clan.
  properties:
    fields:
      type: array
      minItems: 1
      description: Locked fields to release. Only previously locked fields need be listed.
      items:
        $ref: "./clans.yaml#/ClanLockableField"
    reason:
      type: string
      maxLength: 1000
      description: Optional moderator-supplied reason for the unlock, recorded in the audit log.
