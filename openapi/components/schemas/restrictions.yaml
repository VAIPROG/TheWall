  type: object
  properties:
    durationMinutes:
      type: integer
      nullable: true
      description: Updated duration in minutes. Null makes it permanent.
    reason:
      type: string
      maxLength: 1000
      description: Updated reason for the restriction.
    sanctions:
      type: object
      description: Updated individual sanction flags.
      properties:
        mute:
          type: boolean
          default: false
          description: Prevents the user from sending chat messages.
        ban:
          type: boolean
          default: false
          description: Fully prevents the user from accessing the platform.
        publishTemplates:
          type: boolean
          default: false
          description: Prevents the user from creating or publishing templates.
        inviteToClan:
          type: boolean
          default: false
          description: Prevents the user from inviting others to clans.
        sendReports:
          type: boolean
          default: false
          description: Prevents the user from submitting moderation reports.
        sendModmail:
          type: boolean
          default: false
          description: Prevents the user from sending modmail messages.

