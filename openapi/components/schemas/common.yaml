ErrorResponse:
  type: object
  description: |
    Structured error envelope returned by every 4xx/5xx response. The body is
    always a single `error` object carrying a machine-readable `code`, a
    human-readable `message`, and a `traceId` that can be quoted in support
    requests to correlate the failure with server logs.
  required:
    - error
  properties:
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Machine-readable error category. One of the structured categories
            (`not_found`, `forbidden`, `unauthorized`, `bad_request`,
            `conflict`, `rate_limited`, `internal`) or a more specific legacy
            `UPPER_SNAKE_CASE` identifier.
          example: "not_found"
        message:
          type: string
          description: Human-readable error description.
          example: "The request body contains invalid fields."
        traceId:
          type: string
          format: uuid
          description: |
            Correlation id for this failure. Quotable in support requests to
            locate the corresponding entry in the server logs.
          example: "b6a8c3d4-1e2f-4a5b-8c9d-0e1f2a3b4c5d"
        details:
          type: object
          nullable: true
          description: Additional error details.
          example: null

# Alias for the structured error envelope. Reference this (or the equivalent
# shared error responses) from the 4xx/5xx responses of any endpoint.
Error:
  $ref: "#/ErrorResponse"

SuccessMessage:
  type: object
  properties:
    message:
      type: string
      default: "Success"
      description: Status message.
      example: "Success"

Pagination:
  type: object
  required:
    - page
    - perPage
    - total
    - totalPages
  properties:
    page:
      type: integer
      description: Current page number.
    perPage:
      type: integer
      description: Number of items per page.
    total:
      type: integer
      description: Total number of items.
    totalPages:
      type: integer
      description: Total number of pages.

SortOrder:
  type: string
  enum:
    - asc
    - desc
  description: Sort direction.

CursorPage:
  type: object
  description: |
    Generic cursor-pagination envelope. List endpoints embed their items array
    alongside these fields (typically via allOf or by inlining the cursor fields
    next to an `items` property). `nextCursor` / `prevCursor` are opaque tokens
    to pass as `after` / `before` on the next request; they are `null` when
    there is no further page in that direction.
  required:
    - nextCursor
    - prevCursor
    - hasMore
  properties:
    nextCursor:
      type: string
      nullable: true
      description: Opaque cursor pointing to the next page. Null if this is the last page.
    prevCursor:
      type: string
      nullable: true
      description: Opaque cursor pointing to the previous page. Null if this is the first page.
    hasMore:
      type: boolean
      description: Whether additional items exist beyond this page.
