ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code in UPPER_SNAKE_CASE.
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error description.
          example: "The request body contains invalid fields."
        details:
          type: object
          nullable: true
          description: Additional error details.
          example: null

SuccessMessage:
  type: object
  properties:
    message:
      type: string
      default: "Success"
      description: Status message.
      example: "Success"

Pagination:
  type: object
  required:
    - page
    - perPage
    - total
    - totalPages
  properties:
    page:
      type: integer
      description: Current page number.
    perPage:
      type: integer
      description: Number of items per page.
    total:
      type: integer
      description: Total number of items.
    totalPages:
      type: integer
      description: Total number of pages.

SortOrder:
  type: string
  enum:
    - asc
    - desc
  description: Sort direction.

CursorPage:
  type: object
  description: |
    Generic cursor-pagination envelope. List endpoints embed their items array
    alongside these fields (typically via allOf or by inlining the cursor fields
    next to an `items` property). `nextCursor` / `prevCursor` are opaque tokens
    to pass as `after` / `before` on the next request; they are `null` when
    there is no further page in that direction.
  required:
    - nextCursor
    - prevCursor
    - hasMore
  properties:
    nextCursor:
      type: string
      nullable: true
      description: Opaque cursor pointing to the next page. Null if this is the last page.
    prevCursor:
      type: string
      nullable: true
      description: Opaque cursor pointing to the previous page. Null if this is the first page.
    hasMore:
      type: boolean
      description: Whether additional items exist beyond this page.
