ErrorResponse:
  type: object
  required:
    - error
  properties:
    error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code in UPPER_SNAKE_CASE.
          example: "INVALID_INPUT"
        message:
          type: string
          description: Human-readable error description.
          example: "The request body contains invalid fields."
        details:
          type: object
          nullable: true
          description: Additional error details.
          example: null

SuccessMessage:
  type: object
  properties:
    message:
      type: string
      default: "Success"
      description: Status message.
      example: "Success"

Pagination:
  type: object
  required:
    - page
    - perPage
    - total
    - totalPages
  properties:
    page:
      type: integer
      description: Current page number.
    perPage:
      type: integer
      description: Number of items per page.
    total:
      type: integer
      description: Total number of items.
    totalPages:
      type: integer
      description: Total number of pages.

SortOrder:
  type: string
  enum:
    - asc
    - desc
  description: Sort direction.
