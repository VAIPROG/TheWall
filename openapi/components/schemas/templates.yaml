# Mirrors schema/theWallDev/2.json — FROZEN; keep byte-compatible.
WallDevDocument:
  type: object
  required:
    - format
    - createdAt
    - editedAt
    - templates
  properties:
    format:
      type: string
      const: "the-wall-dev/2"
      description: "Format identifier. Must be 'the-wall-dev/2'."
    createdAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp of original creation.
    editedAt:
      type: string
      format: date-time
      description: ISO 8601 timestamp of last modification.
    author:
      description: |
        Author identification. Three modes:
        1. Full object — structured info with UUID.
        2. String 'anon' — explicitly anonymous.
        3. Null — silent anonymous.
        Clients MUST handle all three.
      oneOf:
        - $ref: "#/WallDevAuthor"
        - type: string
          const: "anon"
          description: Explicitly anonymous author.
        - type: "null"
          description: No author information.
    notes:
      type: array
      items:
        type: string
      description: "Free-form notes. Changelogs, instructions, warnings."
    contacts:
      $ref: "#/WallDevContacts"
    domainsWhitelist:
      type: array
      items:
        type: string
        format: hostname
      description: Allowed domains. CLIENT-SIDE enforcement only.
    usersWhitelist:
      type: array
      items:
        type: string
        format: uuid
      description: User IDs ALLOWED to view. BACKEND MUST ENFORCE.
    usersBlocklist:
      type: array
      items:
        type: string
        format: uuid
      description: User IDs BLOCKED from viewing. BACKEND MUST ENFORCE.
    allowedToEdit:
      $ref: "#/WallDevAccessControl"
    templates:
      type: array
      minItems: 1
      description: Template layers. At least one required.
      items:
        $ref: "#/WallDevLayer"

WallDevAuthor:
  type: object
  description: Structured author information.
  properties:
    id:
      type: string
      format: uuid
      description: Author's unique identifier.
    name:
      type: string
      description: Human-readable display name.
    backendUrl:
      type: string
      format: uri
      description: API backend URL. Omit for offline/self-contained files.
    clanId:
      type: string
      format: uuid
      description: Author's clan UUID.
    clanName:
      type: string
      description: Human-readable clan name.

WallDevContacts:
  type: object
  description: Contact information. All fields are arrays — multiple entries per platform.
  properties:
    discord:
      type: array
      items:
        type: object
        required: [type, link]
        properties:
          type:
            type: string
            enum: [user, guild]
            description: "'user' = profile/DM. 'guild' = server invite."
          link:
            type: string
            format: uri
          notes:
            type: array
            items:
              type: string
    telegram:
      type: array
      items:
        type: object
        required: [type, link]
        properties:
          type:
            type: string
            enum: [user, group, channel, bot]
          link:
            type: string
            format: uri
            description: "Full Telegram URL (e.g. https://t.me/...)."
          startParam:
            type: string
            description: "Deep-link ?start= parameter for bots."
          notes:
            type: array
            items:
              type: string
    x:
      type: array
      items:
        type: object
        required: [link]
        properties:
          link:
            type: string
            format: uri
          notes:
            type: array
            items:
              type: string
    matrix:
      type: array
      items:
        type: object
        required: [type, link]
        properties:
          type:
            type: string
            enum: [user, group, bot]
            description: "'bot' = protocol-level user treated as bot by clients for UI purposes."
          link:
            type: string
            description: Matrix ID or matrix.to URL.
          notes:
            type: array
            items:
              type: string
    sites:
      type: array
      items:
        type: object
        required: [url]
        properties:
          url:
            type: string
            format: uri
          notes:
            type: array
            items:
              type: string
    other:
      type: array
      items:
        type: object
        required: [label, url]
        properties:
          label:
            type: string
            description: "Human-readable platform name (e.g. 'Bluesky', 'YouTube')."
          type:
            type: string
            description: Optional machine-readable type hint. Free-form.
          url:
            type: string
            format: uri
          notes:
            type: array
            items:
              type: string

WallDevAccessControl:
  type: object
  description: Edit permissions ACL. BACKEND MUST ENFORCE.
  properties:
    userIds:
      type: array
      items:
        type: string
        format: uuid
    clanIds:
      type: array
      items:
        type: string
        format: uuid

WallDevLayer:
  type: object
  description: A single template layer (TemplateEntry in the frozen schema).
  required:
    - name
    - imageSources
    - x
    - y
    - scale
    - width
    - height
  properties:
    name:
      type: string
      description: Display name of this template layer.
    description:
      type: string
      description: Optional description or instructions.
    imageSources:
      type: array
      minItems: 1
      items:
        type: string
        description: URL or inline data URI pointing to an image.
      description: "Ordered fallback list. Client tries each in order. Last entry SHOULD be a base64 data URI as offline fallback."
    x:
      type: integer
      description: Horizontal position (px) of top-left corner on canvas.
    y:
      type: integer
      description: Vertical position (px) of top-left corner on canvas.
    z:
      type: integer
      description: Depth position. Reserved for future 3D support.
    scale:
      type: number
      exclusiveMinimum: 0
      description: Scale multiplier. 1.0 = native.
    width:
      type: integer
      minimum: 1
      description: Frame width in pixels (before scaling).
    height:
      type: integer
      minimum: 1
      description: Frame height in pixels (before scaling).
    animation:
      $ref: "#/WallDevAnimation"

WallDevAnimation:
  type: object
  description: "Sprite-sheet animation descriptor. Absent for static templates. Supports per-frame image replacement via WallDevFrameOverride.imageSources."
  required:
    - sheet
    - timing
  properties:
    sheet:
      type: object
      description: Physical layout of frames within the sprite-sheet image.
      required:
        - frameWidth
        - frameHeight
        - frameCount
        - layout
        - order
      properties:
        frameWidth:
          type: integer
          minimum: 1
          description: Width of each frame (pixels).
        frameHeight:
          type: integer
          minimum: 1
          description: Height of each frame (pixels).
        frameCount:
          type: integer
          minimum: 1
          description: Total number of frames in the sheet.
        layout:
          type: string
          enum: [line, grid]
          description: "'line' = all frames in a single row or column. 'grid' = frames arranged in a 2D grid."
        order:
          type: string
          enum: [row, column, serpentine]
          description: "'row' = left-to-right, top-to-bottom. 'column' = top-to-bottom, left-to-right. 'serpentine' = alternating direction per row (boustrophedon scan)."
    timing:
      type: object
      description: "Playback timing, sync anchor, and looping."
      required:
        - startTime
        - defaultFrameMs
        - looping
      properties:
        startTime:
          type: number
          description: Epoch ms when timeline begins. All clients sync to this absolute time.
        defaultFrameMs:
          type: number
          minimum: 1
          description: Default per-frame duration (ms).
        looping:
          type: boolean
          description: Restart from frame 0 after last frame.
        frames:
          type: array
          description: "Per-frame overrides. Unlisted frames use defaults and are rendered from the sprite sheet normally."
          items:
            $ref: "#/WallDevFrameOverride"
    scaleMode:
      type: string
      enum: [native, scaled]
      default: native
      description: "'native' = render at original pixel size (crispy pixel art). 'scaled' = apply template scale to animation frames."

WallDevFrameOverride:
  type: object
  description: "Per-frame override. Controls timing, visibility, and optionally replaces the frame image entirely. When imageSources is provided, the client renders that image instead of slicing the sprite sheet at this index."
  required:
    - index
  properties:
    index:
      type: integer
      minimum: 0
      description: Zero-based frame index in traversal order (as defined by sheet.order).
    durationMs:
      type: number
      minimum: 1
      description: "Custom display duration (ms). Overrides timing.defaultFrameMs."
    skip:
      type: boolean
      default: false
      description: "Exclude this frame from playback entirely. When true, imageSources and scale are ignored."
    imageSources:
      type: array
      minItems: 1
      items:
        type: string
        description: URL or inline data URI pointing to an image.
      description: "Replacement image for this frame. Ordered fallback list — client tries each in order. Last entry SHOULD be a base64 data URI as offline fallback."
    width:
      type: integer
      minimum: 1
      description: Width of the replacement image in pixels.
    height:
      type: integer
      minimum: 1
      description: Height of the replacement image in pixels.
    scale:
      type: number
      exclusiveMinimum: 0
      description: "Scale multiplier for the replacement image relative to the frame slot. 1.0 = render at frameWidth × frameHeight."

TemplateSummaryV3:
  type: object
  description: |
    Light projection returned by `GET /api/v3/templates` (list). The `document`
    field is intentionally omitted — v3-native documents embed base64 inline
    images and returning them in a list would be very large. Use
    `GET /api/v3/templates/{id}` or `GET /api/v3/templates/{id}/wall-dev` to
    fetch the full document for a single template.
  required:
    - id
    - userId
    - name
    - x
    - y
    - scale
    - scope
    - status
    - version
    - hasDocument
    - createdAt
  properties:
    id:
      type: string
      format: uuid
      description: Unique template identifier.
    userId:
      type: string
      format: uuid
      description: Account UUID of the template owner.
    name:
      type: string
      description: Template name (copied from the primary document layer).
    x:
      type: integer
      description: Horizontal canvas position (px) of the primary layer.
    y:
      type: integer
      description: Vertical canvas position (px) of the primary layer.
    scale:
      type: number
      description: Scale multiplier. 1.0 = native.
    scope:
      type: string
      enum: [public, clan, private]
      description: Visibility scope.
    status:
      type: string
      enum: [pending, approved, rejected]
      description: Moderation status.
    version:
      type: integer
      description: Optimistic concurrency token. Incremented on each update.
    clanId:
      type: string
      format: uuid
      nullable: true
      description: UUID of the owning clan for clan-scoped templates.
    verifiedAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp when the moderation decision was recorded.
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp.
    hasDocument:
      type: boolean
      description: |
        True when the `document` column is non-NULL (i.e. the row has been
        backfilled to the the-wall-dev/2 format). When false, the `/wall-dev`
        and `/charity` export endpoints will return 409 Conflict.

Template:
  type: object
  description: Server metadata record wrapping an embedded the-wall-dev/2 document.
  required:
    - id
    - scope
    - status
    - author
    - createdAt
    - updatedAt
    - document
  properties:
    id:
      type: string
      format: uuid
      description: Unique template identifier.
    scope:
      type: string
      enum:
        - public
        - clan
        - private
      description: Template visibility scope.
    status:
      type: string
      enum:
        - pending
        - approved
        - rejected
      description: Moderation status.
    author:
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: string
          format: uuid
          description: Author's account UUID.
        username:
          type: string
          description: Author's username.
    clanId:
      type: string
      format: uuid
      nullable: true
      description: UUID of the clan if scoped to a clan.
    previewUrl:
      type: string
      format: uri
      nullable: true
      description: URL to a rendered preview image.
    isPinnedByUser:
      type: boolean
      nullable: true
      description: Whether the current user has pinned this template.
    createdAt:
      type: string
      format: date-time
      description: Creation timestamp.
    updatedAt:
      type: string
      format: date-time
      description: Last update timestamp.
    document:
      $ref: "#/WallDevDocument"
    version:
      type: integer
      description: Optimistic concurrency token. Incremented on each update. Pass as `expectedVersion` in TemplatePatch to guard against lost updates.
    verifiedBy:
      type: string
      format: uuid
      nullable: true
      description: Account UUID of the moderator who approved or rejected this template. Null until a moderation decision is made.
    verifiedAt:
      type: string
      format: date-time
      nullable: true
      description: Timestamp when the moderation decision was recorded. Null until a decision is made.
    rejectionReason:
      type: string
      nullable: true
      description: Human-readable reason supplied by the moderator when the template was rejected. Null if not rejected or no reason was provided.
    viewer:
      type: object
      readOnly: true
      nullable: true
      description: |
        Caller's allowed actions on this template. Null when unauthenticated.
        Clients should use these flags to gate UI affordances rather than
        inferring from role alone.
      properties:
        canEdit:
          type: boolean
          description: Whether the caller may patch this template.
        canDelete:
          type: boolean
          description: Whether the caller may delete this template.
        canVerify:
          type: boolean
          description: Whether the caller may approve or reject this template via `POST /templates/{templateId}/verify`.
    bounds:
      type: object
      readOnly: true
      description: "Read-only convenience bounds computed from all layers in document.templates."
      properties:
        x:
          type: integer
          description: Leftmost x across all layers.
        y:
          type: integer
          description: Topmost y across all layers.
        w:
          type: integer
          description: Total width spanning all layers.
        h:
          type: integer
          description: Total height spanning all layers.

TemplateCreated:
  type: object
  description: |
    Response envelope returned by `POST /templates/new`. Wraps the created
    template record with any non-fatal conversion warnings produced during
    ingest. Warnings are emitted when the submitted `source.format` is not
    `the-wall-dev/2` and the server converts it server-side before storage.
    Empty array for native v2 submissions.
  required:
    - template
    - warnings
  properties:
    template:
      $ref: "#/Template"
    warnings:
      type: array
      items:
        type: string
      description: |
        Non-fatal messages from the server-side format conversion. Present
        (possibly empty) on every response. Non-empty only when the input
        format was `the-wall-dev/1` or `charity` and was converted to
        `the-wall-dev/2` on ingest.
      example: ["converted from the-wall-dev/1 to the-wall-dev/2"]

TemplateCreate:
  type: object
  description: |
    Submit a new template. The server accepts the-wall-dev/2 (native),
    the-wall-dev/1 (migrated to v2 on ingest), or charity (assembled into
    v2 on ingest). The stored canonical form is always the-wall-dev/2.
  required:
    - source
  properties:
    scope:
      type: string
      enum:
        - public
        - clan
        - private
      default: public
      description: Visibility scope.
    clanId:
      type: string
      format: uuid
      nullable: true
      description: UUID of the clan if scoped to a clan.
    source:
      type: object
      required:
        - format
        - document
      properties:
        format:
          type: string
          enum:
            - "the-wall-dev/2"
            - "the-wall-dev/1"
            - "charity"
          description: |
            Input format. The server normalises any accepted format into a
            stored the-wall-dev/2 document:
            - `the-wall-dev/2`: stored as-is.
            - `the-wall-dev/1`: migrated to v2 on ingest.
            - `charity`: assembled into v2 on ingest (lossy conversion).
        document:
          type: object
          description: Raw document payload matching the declared format. Validated server-side against the corresponding schema.
    accessPassword:
      type: string
      nullable: true
      description: |
        Optional per-template share password. When set, anyone with the
        template id and this password can read the template regardless of
        its scope (clan or private). Pass an empty string to clear the password.

TemplatePatch:
  type: object
  description: |
    Flexible partial edit of a stored template. All fields optional.
    `doc` patches document-level fields (metadata, access control).
    `layerOps` applies ordered operations to document.templates[].
    Significant changes (e.g. new layers, access changes) may re-trigger
    the moderation queue.
  properties:
    expectedVersion:
      type: integer
      description: Optimistic concurrency guard. If provided, the server rejects the patch with 409 Conflict when the stored template version does not match.
    scope:
      type: string
      enum:
        - public
        - clan
        - private
      description: Change visibility scope.
    clanId:
      type: string
      format: uuid
      nullable: true
      description: Change the owning clan.
    doc:
      type: object
      description: Partial edit of document-level fields.
      properties:
        name:
          type: string
          description: Name of the first (or primary) template layer.
        notes:
          type: array
          items:
            type: string
          description: Replace document notes array.
        contacts:
          $ref: "#/WallDevContacts"
        access:
          $ref: "#/WallDevAccessControl"
        authorVisibility:
          type: string
          enum: [full, anon, hidden]
          description: |
            Controls how the stored author field is exposed in exports:
            - `full`: expose complete WallDevAuthor object.
            - `anon`: store as the string 'anon'.
            - `hidden`: store as null.
    accessPassword:
      type: string
      nullable: true
      description: |
        Optional per-template share password. When set, anyone with the
        template id and this password can read the template regardless of
        its scope (clan or private). Pass an empty string to clear the password.
    layerOps:
      type: array
      description: Ordered list of layer operations applied sequentially to document.templates[].
      items:
        oneOf:
          - type: object
            description: Add a new layer.
            required: [op, layer]
            properties:
              op:
                type: string
                const: add
              layer:
                $ref: "#/WallDevLayer"
              atIndex:
                type: integer
                minimum: 0
                description: "Insert position. Omit to append."
          - type: object
            description: Remove a layer by index.
            required: [op, index]
            properties:
              op:
                type: string
                const: remove
              index:
                type: integer
                minimum: 0
          - type: object
            description: Move a layer from one index to another.
            required: [op, from, to]
            properties:
              op:
                type: string
                const: move
              from:
                type: integer
                minimum: 0
              to:
                type: integer
                minimum: 0
          - type: object
            description: Apply a partial update to a layer at the given index.
            required: [op, index, patch]
            properties:
              op:
                type: string
                const: update
              index:
                type: integer
                minimum: 0
              patch:
                type: object
                description: Partial WallDevLayer — only provided fields are updated.

TemplatePage:
  allOf:
    - $ref: "#/Template"
    - $ref: "./common.yaml#/Pagination"

TemplateVerifyRequest:
  type: object
  description: Body for the template verification endpoint. Submitted by a moderator to approve or reject a pending template.
  required:
    - decision
  properties:
    decision:
      type: string
      enum:
        - approve
        - reject
      description: Moderation decision — `approve` sets status to `approved`; `reject` sets status to `rejected`.
    reason:
      type: string
      maxLength: 1000
      description: Optional moderator-supplied reason. Required (by convention) when decision is `reject`; ignored on approval.

CharityEntry:
  type: object
  description: A single template entry in the Charity (Bluemarble-style) format.
  required:
    - x
    - y
  properties:
    name:
      type: string
      description: Template name.
    sources:
      type: array
      items:
        type: string
        format: uri
      description: |
        Ordered fallback image URLs. The first entry is always a backend
        `/api/v3/templates/{id}/png?layer={idx}` URL, because Charity cannot
        consume `data:` URLs and has no native `scale` field; the PNG
        endpoint bakes the layer's scale into the rendered image. Any
        original `imageSources` from the the-wall-dev/2 document follow
        as fallback entries.
    x:
      type: number
      description: X coordinate on canvas.
    y:
      type: number
      description: Y coordinate on canvas.
    frameWidth:
      type: number
      nullable: true
      description: Width of each animation frame (pixels).
    frameHeight:
      type: number
      nullable: true
      description: Height of each animation frame (pixels).
    frameCount:
      type: integer
      description: Total number of animation frames.
    secondsPerFrame:
      type: number
      description: Duration of each frame in seconds.
    startTimestamp:
      type: number
      description: Epoch timestamp (ms) for animation sync.
    looping:
      type: boolean
      description: Whether the animation loops.

CharityConfig:
  type: object
  description: |
    Charity (Bluemarble-style) template config. Derived on demand from the
    stored the-wall-dev/2 document. Conversion is lossy — some v2 features
    (per-frame image overrides, access control, contacts) are not expressible
    in the Charity format. Charity compatibility is permanent and supported
    indefinitely.
  required:
    - templates
  properties:
    faction:
      type: string
      description: Faction or group identifier.
    contact:
      type: string
      description: Contact string (URL or handle).
    templates:
      type: array
      items:
        $ref: "#/CharityEntry"
      description: Template entries derived from document layers.
    whitelist:
      type: array
      items:
        type: string
      description: Optional domain or user whitelist entries.
