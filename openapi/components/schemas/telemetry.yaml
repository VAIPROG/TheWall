TelemetryBatch:
  type: object
  required:
    - events
  properties:
    events:
      type: array
      minItems: 1
      maxItems: 100
      items:
        $ref: "./telemetry.yaml#/TelemetryEvent"
      description: Batch of telemetry events.

TelemetryEvent:
  type: object
  required:
    - type
    - timestamp
  properties:
    type:
      type: string
      enum:
        - error
        - performance
        - interaction
        - page_view
        - custom
      description: Event category.
    timestamp:
      type: string
      format: date-time
      description: When the event occurred on the client.
    data:
      type: object
      description: Event-specific payload data.
    sessionId:
      type: string
      format: uuid
      description: Client session identifier for correlating events.
    pageUrl:
      type: string
      description: URL of the page where the event occurred.

HealthStatus:
  type: object
  required:
    - status
    - uptime
    - database
    - maintenanceMode
    - version
  properties:
    status:
      type: string
      enum:
        - healthy
        - degraded
        - maintenance
      description: Overall server health status.
    uptime:
      type: integer
      description: Server uptime in seconds.
    database:
      type: string
      enum:
        - connected
        - disconnected
      description: Database connectivity status.
    maintenanceMode:
      type: boolean
      description: Whether the server is in maintenance mode.
    maintenanceReason:
      type: string
      nullable: true
      description: Reason for maintenance mode, if active.
    version:
      type: string
      description: Server version string.

LogEntry:
  type: object
  required:
    - level
    - message
    - timestamp
  properties:
    level:
      type: string
      enum:
        - trace
        - debug
        - info
        - warn
        - error
        - fatal
      description: Severity level of the log entry.
    message:
      type: string
      maxLength: 8000
      description: Human-readable log message.
    timestamp:
      type: string
      format: date-time
      description: When the log event occurred on the client.
    source:
      type: string
      nullable: true
      description: Module or component that emitted the log entry.
    sessionId:
      type: string
      format: uuid
      nullable: true
      description: Client session identifier for correlating log entries.
    context:
      type: object
      nullable: true
      description: Arbitrary key-value metadata attached to the log entry.
    stack:
      type: string
      nullable: true
      description: Stack trace, typically populated for error or fatal entries.
    tags:
      type: array
      nullable: true
      items:
        type: string
      description: Optional labels for filtering and grouping log entries.

LogBatch:
  type: object
  required:
    - clientVersion
    - logs
  properties:
    clientVersion:
      type: string
      description: Version string of the client application emitting the logs.
    sessionId:
      type: string
      format: uuid
      nullable: true
      description: Session identifier shared across all entries in this batch.
    logs:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: "./telemetry.yaml#/LogEntry"
      description: Ordered list of log entries to ingest.

LogRecord:
  allOf:
    - $ref: "./telemetry.yaml#/LogEntry"
    - type: object
      required:
        - id
        - accountId
        - clientVersion
        - ip
        - receivedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique server-assigned identifier for the stored log record.
        accountId:
          type: string
          format: uuid
          nullable: true
          description: >-
            UUID of the account that uploaded this record. Null when the
            uploader was anonymous or opted out of identity linking.
        clientVersion:
          type: string
          description: Client version string reported in the originating batch.
        ip:
          type: string
          nullable: true
          description: >-
            Source IP address of the uploading client. Returned only for
            global admin / owner callers; always null in other contexts.
        receivedAt:
          type: string
          format: date-time
          description: Timestamp at which the server received and stored this record.

LogPage:
  allOf:
    - $ref: "./common.yaml#/CursorPage"
    - type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "./telemetry.yaml#/LogRecord"
          description: Log records on this page.

LogIngestResult:
  type: object
  required:
    - accepted
    - rejected
  properties:
    accepted:
      type: integer
      description: Number of log entries accepted and stored.
    rejected:
      type: integer
      description: >-
        Number of log entries rejected (e.g. failed validation, exceeded
        per-entry size limit, or filtered by server policy).

MetricsSnapshot:
  type: object
  required:
    - requestRate
    - averageLatencyMs
    - activeConnections
    - databasePool
    - memoryUsageMb
    - cpuUsagePercent
  properties:
    requestRate:
      type: number
      format: float
      description: Requests per second.
    averageLatencyMs:
      type: number
      format: float
      description: Average response latency in milliseconds.
    activeConnections:
      type: integer
      description: Number of active client connections.
    databasePool:
      type: object
      required:
        - active
        - idle
        - waiting
      properties:
        active:
          type: integer
          description: Active database connections in the pool.
        idle:
          type: integer
          description: Idle database connections in the pool.
        waiting:
          type: integer
          description: Requests waiting for a database connection.
      description: Database connection pool statistics.
    memoryUsageMb:
      type: number
      format: float
      description: Memory usage in megabytes.
    cpuUsagePercent:
      type: number
      format: float
      description: CPU usage as a percentage (0-100).
