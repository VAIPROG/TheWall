BadRequest:
  description: Invalid request
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Unauthorized:
  description: Authentication required
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Forbidden:
  description: Insufficient permissions
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

NotFound:
  description: Resource not found
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Gone:
  description: Endpoint removed
  example:
    error:
      code: "ENDPOINT_REMOVED"
      message: "This endpoint has been removed. Please migrate to the v2 API."
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

Conflict:
  description: Resource conflict
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

UnprocessableEntity:
  description: Semantically incorrect request
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"

PayloadTooLarge:
  description: Payload too large
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        error:
          code: "PAYLOAD_TOO_LARGE"
          message: "The request payload exceeds the maximum allowed size."
          details: null

TooManyRequests:
  description: Rate limit exceeded
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
  headers:
    X-RateLimit-Limit:
      $ref: "../headers/rate-limit.yaml#/X-RateLimit-Limit"
    X-RateLimit-Remaining:
      $ref: "../headers/rate-limit.yaml#/X-RateLimit-Remaining"
    X-RateLimit-Reset:
      $ref: "../headers/rate-limit.yaml#/X-RateLimit-Reset"

Locked:
  description: A field is locked by global moderation and cannot be modified by clan-level roles.
  content:
    application/json:
      schema:
        $ref: "../schemas/common.yaml#/ErrorResponse"
      example:
        error:
          code: "FIELD_LOCKED"
          message: "One or more fields are locked by global moderation and cannot be changed by clan-level roles."
          details: null
