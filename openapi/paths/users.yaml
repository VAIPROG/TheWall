UsersMeRecoveryPhrase:
  post:
    tags: [Users]
    summary: Generate or rotate mnemonic recovery phrase
    operationId: generateMyRecoveryPhrase
    description: |
      Generates (or rotates) an 8-word BIP-39-style mnemonic recovery phrase
      for the current account. The phrase is returned **once** in this
      response — it cannot be retrieved again.

      The server stores only a salted argon2id hash of the normalised phrase.
      The phrase can be used at `POST /auth/recover` to obtain a recovery
      session when all other login factors are unavailable.

      Calling this endpoint rotates the phrase, invalidating any previous one.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
    responses:
      "200":
