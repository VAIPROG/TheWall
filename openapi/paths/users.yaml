      Removes the SiteIdentity for the given `site` from the current account.

      **Guard:** if this is the last remaining login factor across all
      SiteIdentities AND SocialLinks, the server returns `409 Conflict`
      (`LAST_LOGIN_FACTOR`) to prevent account lockout. Link another provider
      before unlinking.
