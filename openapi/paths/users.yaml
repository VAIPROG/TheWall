      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Current user profile.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/users.yaml#/UserSelf"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
  patch:
    tags: [Users]
    summary: Update current user profile
    operationId: updateMe
    description: |
      Partially updates profile. Updatable: `displayName`, `username`,
      `bio`, `lang`, `telemetryOptIn`. Username changes may be
      rate-limited.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/users.yaml#/UserUpdate"
    responses:
      "200":
        description: Profile updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/users.yaml#/UserSelf"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"
      "422":
        $ref: "../components/responses/common.yaml#/UnprocessableEntity"
  delete:
    tags: [Users]
    summary: Delete own account
    operationId: deleteMe
    description: |
      Permanently deletes the account and all associated data.
      Requires confirmation in the request body. Cannot be undone.
