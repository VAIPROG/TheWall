      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/ConfirmationRequest"
    responses:
      "200":
        description: Account deleted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

