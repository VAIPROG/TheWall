    responses:
      "200":
        description: Site identity unlinked.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

UsersMeMerge:
  post:
    tags: [Users]
    summary: Merge account B into the current account (A)
    operationId: mergeIntoMe
    description: |
      Folds account **B** into the authenticated account **A**.
      Requires a `mergeToken` minted by `POST /auth/merge/initiate`
      while authenticated as B.

      **Effects:**
      - B's SiteIdentities are re-parented onto A. If A and B both hold an
        identity on the **same** site → `409 MERGE_SITE_CONFLICT`.
      - B's SocialLinks are unioned (deduplicated by provider/uid).
      - B's templates have `author.id` rewritten to A.
      - B's API keys are **revoked** (not transferred).
      - B is tombstoned; a UUID alias row (B→A) is kept for 90 days.

      **Irreversible** after the tombstone grace window. Explicit confirmation
      is built into the merge token (callers must have minted it knowingly).
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/MergeRequest"
    responses:
      "200":
        description: Merge completed successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/MergeResult"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

