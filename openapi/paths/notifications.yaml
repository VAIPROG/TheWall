# ══════════════════════════════════════════════════════════════════════
# NOTIFICATIONS — Delivery and Lifecycle
# ══════════════════════════════════════════════════════════════════════

Notifications:
  get:
    tags: [Notifications]
    summary: List notifications
    operationId: listNotifications
    description: |
      Offset-paginated list of the caller's notifications, newest first.
      Dismissed notifications are excluded. Filter by read/unread state via
      `read`. NOTE — this endpoint's pagination parameters use snake_case
      (`per_page`), unlike most of the V3 API.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: page
        in: query
        description: Page number (1-based).
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        description: Items per page.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: read
        in: query
        schema:
          type: boolean
        description: "Filter by read status: true = only read, false = only unread."
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Notifications.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notifications.yaml#/NotificationPage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

NotificationsAck:
  post:
    tags: [Notifications]
    summary: Acknowledge notifications
    operationId: ackNotifications
    description: Marks one or more notifications as read.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/notifications.yaml#/AckRequest"
    responses:
      "200":
        description: Notifications acknowledged.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

NotificationsAckAll:
  post:
    tags: [Notifications]
    summary: Mark all notifications as read
    operationId: ackAllNotifications
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: All notifications marked read.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

NotificationsSettings:
  get:
    tags: [Notifications]
    summary: Get notification preferences
    operationId: getNotificationSettings
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Notification settings.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notifications.yaml#/NotificationSettings"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
  patch:
    tags: [Notifications]
    summary: Update notification preferences
    operationId: updateNotificationSettings
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/notifications.yaml#/NotificationSettingsUpdate"
    responses:
      "200":
        description: Settings updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notifications.yaml#/NotificationSettings"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

NotificationById:
  get:
    tags: [Notifications]
    summary: Get a specific notification
    operationId: getNotification
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Notification.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/notifications.yaml#/Notification"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  delete:
    tags: [Notifications]
    summary: Dismiss a notification
    operationId: deleteNotification
    description: Permanently removes from user's list.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Notification dismissed.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
