# ══════════════════════════════════════════════════════════════════════
# CLANS — Creation, Membership, Governance
# ══════════════════════════════════════════════════════════════════════

Clans:
  get:
    tags: [Clans]
    summary: List / search clans
    operationId: listClans
    description: |
      Paginated, filterable list of clans. Supports search by name,
      sorting by member count, creation date, or activity.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/PageParam"
      - $ref: "../components/parameters/common.yaml#/PerPageParam"
      - name: search
        in: query
        schema:
          type: string
        description: Search clans by name.
      - name: sortBy
        in: query
        schema:
          type: string
          enum: [name, memberCount, createdAt, activity]
          default: createdAt
      - name: order
        in: query
        schema:
          $ref: "../components/schemas/common.yaml#/SortOrder"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Paginated clan list.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanPage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

ClansNew:
  post:
    tags: [Clans]
    summary: Create a new clan
    operationId: createClan
    description: |
      Creates a new clan. The authenticated user becomes the clan
      owner. A user can only own one clan at a time (configurable).
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanCreate"
    responses:
      "201":
        description: Clan created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/Clan"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

ClanById:
  get:
    tags: [Clans]
    summary: Get clan details
    operationId: getClan
    description: |
      Returns full clan information including name, description,
      member count, creation date, settings summary, and clan
      chat ID.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan details.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/Clan"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    tags: [Clans]
    summary: Update clan info
    operationId: updateClan
    description: |
      Updates clan name, description, avatar, or other public fields.
      Requires clan `owner` or `admin` role.

      Fields listed in `Clan.moderation.lockedFields` cannot be changed by
      clan-level roles — attempts return `423 Locked`. Only a global moderator
      or higher can release locks via `POST /moderation/clans/{clanId}/unlock`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanUpdate"
    responses:
      "200":
        description: Clan updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/Clan"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "423":
        $ref: "../components/responses/common.yaml#/Locked"

ClanMembers:
  get:
    tags: [Clans]
    summary: List clan members
    operationId: listClanMembers
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/PageParam"
      - $ref: "../components/parameters/common.yaml#/PerPageParam"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan members.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanMemberPage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanMemberById:
  get:
    tags: [Clans]
    summary: Get a specific clan member
    operationId: getClanMember
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/UserIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan member details.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanMember"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    tags: [Clans]
    summary: Update member role
    operationId: updateClanMember
    description: |
      Changes a member's clan role. Requires appropriate hierarchy.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/UserIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanMemberRoleUpdate"
    responses:
      "200":
        description: Member role updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanMember"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  delete:
    tags: [Clans]
    summary: Kick a member from clan
    operationId: kickClanMember
    description: |
      Removes a member. Cannot kick equal or higher role.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/UserIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Member kicked.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanInvites:
  get:
    tags: [Clans]
    summary: List pending invites
    operationId: listClanInvites
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Pending invites.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/clans.yaml#/ClanInvite"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  post:
    tags: [Clans]
    summary: Create a clan invite
    operationId: createClanInvite
    description: |
      Creates an invitation link or direct user invite.
      Configurable: expiry, max uses, target user.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanInviteCreate"
    responses:
      "201":
        description: Invite created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanInvite"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"

ClanInviteById:
  delete:
    tags: [Clans]
    summary: Revoke a clan invite
    operationId: revokeClanInvite
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - name: inviteId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Invite revoked.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanJoin:
  post:
    tags: [Clans]
    summary: Join a clan
    operationId: joinClan
    description: |
      Join using invite code in body or if clan accepts open
      membership. May require admin/moderator approval.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanJoinRequest"
    responses:
      "200":
        description: Joined clan (or application submitted).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

ClanLeave:
  post:
    tags: [Clans]
    summary: Leave a clan
    operationId: leaveClan
    description: |
      The authenticated user leaves. If owner, must transfer
      ownership first.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Left clan.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

ClanDisband:
  post:
    tags: [Clans]
    summary: Disband (delete) a clan
    operationId: disbandClan
    description: |
      Permanently dissolves the clan. **Clan owner only.**
      Requires confirmation.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/ConfirmationRequest"
    responses:
      "200":
        description: Clan disbanded.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"

ClanSettings:
  get:
    tags: [Clans]
    summary: Get clan settings
    operationId: getClanSettings
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan settings.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanSettings"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    tags: [Clans]
    summary: Update clan settings
    operationId: updateClanSettings
    description: |
      Updates clan configuration settings. Requires clan `owner` or `admin` role.

      Settings that correspond to fields listed in `Clan.moderation.lockedFields`
      (e.g. `discoverable`) cannot be changed by clan-level roles — attempts
      return `423 Locked`. Only a global moderator or higher can release locks via
      `POST /moderation/clans/{clanId}/unlock`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanSettingsUpdate"
    responses:
      "200":
        description: Settings updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanSettings"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "423":
        $ref: "../components/responses/common.yaml#/Locked"

ClanApplyRole:
  post:
    tags: [Clans]
    summary: Apply for a staff role
    operationId: applyForClanRole
    description: |
      Submit application for clan `admin` or `moderator`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - name: role
        in: path
        required: true
        schema:
          type: string
          enum: [admin, moderator]
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../components/schemas/clans.yaml#/ClanRoleApplication"
    responses:
      "200":
        description: Application submitted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

ClanReport:
  post:
    tags: [Clans]
    summary: Report a clan
    operationId: reportClan
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/moderation.yaml#/ReportCreate"
    responses:
      "201":
        description: Report submitted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanTemplates:
  get:
    tags: [Clans]
    summary: List clan templates
    operationId: listClanTemplates
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/PageParam"
      - $ref: "../components/parameters/common.yaml#/PerPageParam"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan templates.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/TemplatePage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanRestrictions:
  get:
    tags: [Clans]
    summary: List clan-scoped restrictions
    operationId: listClanRestrictions
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - $ref: "../components/parameters/common.yaml#/PageParam"
      - $ref: "../components/parameters/common.yaml#/PerPageParam"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan restrictions.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/restrictions.yaml#/RestrictionPage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanApplications:
  get:
    tags: [Clans]
    summary: List pending join applications
    operationId: listClanApplications
    description: |
      Returns all pending join applications for the clan.
      Requires `manage_members` or `manage_invites` permission.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Pending join applications.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/clans.yaml#/ClanJoinApplication"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

ClanApplicationReview:
  post:
    tags: [Clans]
    summary: Review a join application
    operationId: reviewClanApplication
    description: |
      Approve or reject a pending clan join application.
      Requires `manage_members` or `manage_invites` permission.
      Approved applicants are added as members with the `defaultMemberRole`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Unique identifier of the join application.
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - decision
            properties:
              decision:
                type: string
                enum:
                  - approve
                  - reject
                description: Whether to approve or reject the application.
              reason:
                type: string
                description: Optional reason communicated to the applicant on rejection.
    responses:
      "200":
        description: Application reviewed.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/clans.yaml#/ClanJoinApplication"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"

# ── Discord clan integration (v6.2.8) ────────────────────────────────────────
ClansDiscordOwnedGuilds:
  get:
    tags: [Clans]
    summary: List the caller's server-verified owned Discord guild ids
    operationId: clansDiscordOwnedGuilds
    description: |
      Returns the Discord guild ids the caller was verified to own during the
      most recent clan-guilds OAuth round-trip (empty if none/expired — the
      client re-runs the consent via `/auth/oauth/start` with `intent=clan-guilds`).
    security: [{ BearerAuth: [] }]
    responses:
      "200":
        description: Verified owned guild ids.
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties: { id: { type: string } }

ClansSiteSuggestion:
  get:
    tags: [Clans]
    summary: The caller's filianislost site-clan suggestion
    operationId: clansSiteSuggestion
    description: The stored site-clan the caller can import via `/clans/from-site`, or 204 when none.
    security: [{ BearerAuth: [] }]
    responses:
      "200":
        description: The suggestion.
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string }
                externalId: { type: string }
                name: { type: string }
                displayName: { type: string, nullable: true }
                discordId: { type: string, nullable: true }
                icon: { type: string, nullable: true }
      "204": { description: No site clan to import. }

ClansFromGuild:
  post:
    tags: [Clans]
    summary: Create an owner-verified clan from an owned Discord guild
    operationId: clansFromGuild
    description: |
      Creates a clan bound to a Discord guild the caller was server-verified to
      own (the guild id must be in the caller's verified cache; single-use).
      `ownerVerified=true`, `ownerVerifiedVia=discord`.
    security: [{ BearerAuth: [] }]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [guildId]
            properties:
              guildId: { type: string }
              name: { type: string }
              tag: { type: string }
    responses:
      "200":
        description: Created clan id.
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string, format: uuid } } }
      "403": { description: Guild ownership not verified (re-run the Discord consent). }
      "409": { description: This guild is already a clan. }

ClansFromSite:
  post:
    tags: [Clans]
    summary: Create an owner-unverified clan from the site suggestion
    operationId: clansFromSite
    description: Creates a clan from the caller's stored filianislost suggestion; `ownerVerified=false` until confirmed.
    security: [{ BearerAuth: [] }]
    responses:
      "200":
        description: Created clan id.
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string, format: uuid } } }
      "409": { description: "No site clan to import, or the clan already exists." }

ClansVerifyOwnership:
  post:
    tags: [Clans]
    summary: Verify ownership of an unverified clan via Discord
    operationId: clansVerifyOwnership
    description: |
      A clan admin proves ownership of the clan's bound Discord guild (the guild
      id must be in the caller's verified cache) → flips `ownerVerified=true`.
    security: [{ BearerAuth: [] }]
    parameters:
      - name: clanId
        in: path
        required: true
        schema: { type: string, format: uuid }
    responses:
      "200":
        description: Clan id (now verified).
        content:
          application/json:
            schema: { type: object, properties: { id: { type: string, format: uuid } } }
      "403": { description: "Not a clan admin, or guild ownership not verified." }
      "409": { description: Clan has no Discord server to verify. }

# ── Clan roster & media (avatars, banners) ──────────────────────────────────
ClansMine:
  get:
    tags: [Clans]
    summary: List the caller's clans
    operationId: listMyClans
    description: |
      Returns the clans the authenticated caller is an active member of, plus
      any clans they own. Each entry uses the same shape as `GET /clans/{clanId}`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: The caller's active and owned clans.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/clans.yaml#/Clan"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

ClanAvatar:
  get:
    tags: [Clans]
    summary: Get a clan's avatar
    operationId: getClanAvatar
    description: |
      **Public** — no authentication required, reachable directly by an
      `<img>` tag. Always returns `200`, serving the custom clan avatar or a
      generated identicon fallback.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    responses:
      "200":
        description: Clan avatar image.
        content:
          image/webp:
            schema:
              type: string
              format: binary
          image/svg+xml:
            schema:
              type: string
              format: binary
  post:
    tags: [Clans]
    summary: Upload or replace a clan avatar
    operationId: uploadClanAvatar
    description: |
      Sets the clan's custom avatar from a base64 `data:` URL. **Clan admin only.**
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [image]
            properties:
              image:
                type: string
                description: Image as a `data:` URL (e.g. `data:image/png;base64,...`).
                example: "data:image/png;base64,iVBORw0KGgo..."
    responses:
      "200":
        description: Clan avatar updated.
        content:
          application/json:
            schema:
              type: object
              required: [ok, url, size]
              properties:
                ok: { type: boolean, example: true }
                url: { type: string, description: URL of the stored avatar. }
                size: { type: integer, description: Stored image size in bytes. }
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "413":
        $ref: "../components/responses/common.yaml#/PayloadTooLarge"
      "415":
        description: Unsupported or undecodable image.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/ErrorResponse"
  delete:
    tags: [Clans]
    summary: Remove a clan's custom avatar
    operationId: deleteClanAvatar
    description: Reverts to the generated identicon fallback. **Clan admin only.**
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/ClanIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Clan avatar removed.
        content:
          application/json:
            schema:
              type: object
              required: [ok]
              properties:
                ok: { type: boolean, example: true }
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

