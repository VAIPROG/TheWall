TemplatesPinned:
  get:
    tags: [Templates]
    summary: List pinned templates
    operationId: listPinnedTemplates
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/PageParam"
      - $ref: "../components/parameters/common.yaml#/PerPageParam"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Pinned templates.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/TemplatePage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

TemplateVerify:
  post:
    tags: [Templates]
    summary: Approve or reject a template
    operationId: verifyTemplate
    description: |
      Submit a moderation decision (approve or reject) for a template.

      **Authorization**
      - Global moderator+ may verify any template regardless of scope.
      - Clan moderator+ of the template's clan may verify clan-scoped templates
        in their clan only. Attempting to verify a public or private template
        without global moderator+ returns `403 Forbidden`.

      **Effect**
      - `approve` → sets `status: approved`, records `verifiedBy` and `verifiedAt`.
      - `reject` → sets `status: rejected`, records `verifiedBy`, `verifiedAt`,
        and `rejectionReason` (from the request `reason` field).

      The response always returns the updated `Template` object so callers can
      observe the new `status`, `verifiedBy`, `verifiedAt`, and `rejectionReason`
      in a single round-trip.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
    security:
      - BearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/templates.yaml#/TemplateVerifyRequest"
    responses:
      "200":
        description: Moderation decision recorded. Returns the updated template.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/Template"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"
