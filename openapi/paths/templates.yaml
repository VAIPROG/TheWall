# ══════════════════════════════════════════════════════════════════════
# TEMPLATES — Upload, Discovery, Editing, Sharing
# ══════════════════════════════════════════════════════════════════════

Templates:
  get:
    tags: [Templates]
    summary: List / search templates
    operationId: listTemplates
    description: |
      Filterable template discovery with **cursor pagination** (newest first).
      Public approved templates are listed without authentication. Clan and
      private templates are only included when the caller is authenticated
      (Bearer, API key, or `?session` token). Filter by `scope`, `status`,
      and `author`.

      **Pagination.** Results are ordered by `createdAt` descending. Pass the
      `createdAt` of the last item you received as `cursor` to fetch the next
      page — the server returns items with `createdAt < cursor`. There is no
      page/offset pagination on this endpoint.

      **Access control.** The document access block (`usersWhitelist`,
      `usersBlocklist`, `allowedToEdit`) is enforced here: templates the caller
      may not view are silently omitted from the list rather than surfaced.
      `domainsWhitelist` is CLIENT-SIDE only and is never enforced by the backend.

      **Anonymity.** `userId` is `null` for templates published anonymously,
      unless the caller is the owner or global staff.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - name: scope
        in: query
        description: Only return templates with this visibility scope.
        schema:
          type: string
          enum: [public, clan, private]
      - name: status
        in: query
        description: Only return templates with this moderation status.
        schema:
          type: string
          enum: [pending, approved, rejected]
      - name: author
        in: query
        description: Only return templates created by this account UUID.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Maximum number of items to return.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        description: |
          Cursor for pagination — a `createdAt` timestamp. Returns only items
          with `createdAt` strictly before this instant. Pass the `createdAt`
          of the last item from the previous page.
        schema:
          type: string
          format: date-time
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: |
          Template list (light projection — no `document` field), newest
          first. A JSON array, not a pagination envelope.
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "../components/schemas/templates.yaml#/TemplateSummaryV3"
            example:
              - id: "3f6f0a4e-8f5a-4f2e-9d3b-2f9c6a1e7b10"
                userId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                name: "Snackers banner"
                x: 120
                y: 48
                scale: 1
                scope: public
                status: approved
                version: 3
                clanId: null
                verifiedAt: "2026-07-01T12:34:56Z"
                createdAt: "2026-06-28T09:00:00Z"
                hasDocument: true
                templateCount: 1
                animated: false
              - id: "b1a7dd93-1c62-47a9-a2f4-c1d2e3f4a5b6"
                userId: null
                name: "Anonymous art"
                x: -300
                y: 512
                scale: 2
                scope: public
                status: approved
                version: 1
                clanId: null
                verifiedAt: "2026-06-20T08:15:00Z"
                createdAt: "2026-06-19T22:41:07Z"
                hasDocument: true
                templateCount: 2
                animated: true

TemplatesNew:
  post:
    tags: [Templates]
    summary: Upload a new template
    operationId: createTemplate
    description: |
      Creates a new template. The resulting `status` depends on scope, caller
      role, and server configuration.

      **Server-side format conversion**
      The server accepts `the-wall-dev/2` (stored as-is), `the-wall-dev/1`
      (converted to v2 on ingest), and `charity` (assembled into v2 on ingest).
      The stored canonical form is always `the-wall-dev/2`. Non-fatal messages
      produced during conversion are returned in `warnings`; `warnings` is
      always present and empty for native v2 inputs.

      **Publish gating by scope**
      - `private` — any authenticated user; always auto-approved.
      - `clan` — caller must be a member of the target clan; additionally
        gated by the clan's `chatPermissions.whoCanPostTemplates`
        (`everyone` | `members` | `moderators`). Members below the required
        threshold receive `403 Forbidden`.
      - `public` — any authenticated user when server
        `allowPublicTemplatePublishing` is true (default). When false, only
        admin+ may publish public-scope templates; others receive `403 Forbidden`.

      **Auto-approval**
      When server `autoApproveModeratorTemplates` is true (default), templates
      published by a sufficiently privileged caller are set to `approved`
      immediately, bypassing the moderation queue:
      - `public` scope → caller is global moderator+.
      - `clan` scope → caller is clan moderator+ of the target clan, or global
        moderator+.
      - `private` scope → always approved regardless of role or server flag.

      All other cases result in `status: pending` and the template enters the
      moderation queue.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/templates.yaml#/TemplateCreate"
          examples:
            nativeV2:
              summary: Publish a private native the-wall-dev/2 template
              value:
                scope: private
                source:
                  format: "the-wall-dev/2"
                  document:
                    format: "the-wall-dev/2"
                    createdAt: "2026-07-18T10:00:00Z"
                    editedAt: "2026-07-18T10:00:00Z"
                    templates:
                      - name: "My overlay"
                        imageSources:
                          - "data:image/png;base64,iVBORw0KGgo..."
                        x: 120
                        y: 48
                        scale: 1
                        width: 64
                        height: 64
    responses:
      "201":
        description: |
          Template created. `warnings` is always present; non-empty only when
          the input was converted from `the-wall-dev/1` or `charity`.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/TemplateCreated"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "422":
        $ref: "../components/responses/common.yaml#/UnprocessableEntity"

AdminTemplatesBackfillDocuments:
  post:
    tags: [Templates]
    summary: Backfill share→document for legacy template rows (admin)
    operationId: adminBackfillTemplateDocuments
    description: |
      Admin-only one-shot migration job. Selects up to 1 000 template rows
      whose `document` column is NULL (legacy share-based rows created before
      the v3 `document` column existed), decodes each row's `share` field via
      the server-side format converter, and writes the resulting
      `the-wall-dev/2` document back into `document`.

      Returns a summary of how many rows were scanned, migrated, failed to
      decode/write, and how many still remain after the batch. Call repeatedly
      until `remaining` reaches 0.

      Rows that cannot be decoded are left untouched (document stays NULL) and
      counted in `failed` — they will appear again in subsequent calls.
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Batch complete. Returns migration counts.
        content:
          application/json:
            schema:
              type: object
              required:
                - scanned
                - migrated
                - failed
                - remaining
              properties:
                scanned:
                  type: integer
                  description: Number of NULL-document rows selected in this batch (capped at 1 000).
                migrated:
                  type: integer
                  description: Number of rows successfully decoded and updated in this batch.
                failed:
                  type: integer
                  description: Number of rows that could not be decoded or written. Left unchanged.
                remaining:
                  type: integer
                  description: Total count of NULL-document rows remaining after this batch.
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"

TemplateById:
  get:
    tags: [Templates]
    summary: Get template details
    operationId: getTemplate
    description: |
      Returns the full template details including the the-wall-dev/2 document.
      Public approved templates are readable without authentication. Clan and
      private templates require one of: Bearer JWT, API key, `?session` token,
      or the per-template `?password`. The `?password` and `?session` query
      params power share links to private templates without exposing the
      owner's long-term credentials.

      **Access control.** The document access block is enforced on read:
      `usersWhitelist` / `usersBlocklist` gate viewing and `allowedToEdit`
      grants co-edit access. When a template exists but the caller may not
      view it, the server returns **`404 Not Found`** (not `403`) so the
      response never leaks the existence of a template the caller cannot see.
      `domainsWhitelist` is CLIENT-SIDE only and is never enforced here.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
      - name: If-None-Match
        in: header
        description: |
          Conditional GET. Pass the ETag value from a previous response to
          receive 304 Not Modified when the template has not changed.
        schema:
          type: string
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Template details.
        headers:
          ETag:
            description: Strong ETag — format `"<id>-v<version>"`. Pass as `If-None-Match` on subsequent requests.
            schema:
              type: string
          Cache-Control:
            description: Always `private, must-revalidate`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/Template"
      "304":
        description: Not Modified. The template has not changed since the supplied ETag.
        headers:
          ETag:
            description: Current ETag (same value that was submitted in If-None-Match).
            schema:
              type: string
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    tags: [Templates]
    summary: Patch a template
    operationId: patchTemplate
    description: |
      Flexible partial edit of a stored template. Supports changing scope/clan,
      patching document-level metadata (`doc`: name, notes, contacts, access
      control, author visibility), and applying ordered layer operations
      (`layerOps`: add, remove, move, update) to `document.templates[]`.

      **Derived columns.** The flat `name` / `x` / `y` / `scale` columns are
      NOT patched directly — after `doc` and `layerOps` are applied, they are
      re-derived from `document.templates[0]`. To move or rename a template,
      update layer 0 via a `{"op": "update", "index": 0, ...}` layer op.

      **Concurrency.** Pass `expectedVersion` (the `version` you last read) to
      guard against lost updates — the server returns `409 Conflict` when the
      stored version differs. Each successful PATCH increments `version`.

      **Scope changes.** Only the template owner or a global admin may change
      `scope` / `clanId`; `clan` scope additionally requires membership of the
      target clan. `accessPassword` sets the per-template share password; an
      empty string clears it; omit the field to leave it unchanged.

      **Access control.** Edit rights are enforced on PATCH: the owner,
      global admins, and any co-editor listed in the document `allowedToEdit`
      block (`userIds` / `clanIds`) may patch; everyone else receives `403`.
      The access block itself is set here via `doc.access` (co-editors) and
      mirrored from create. Rows without a backfilled v2 `document` return
      `409 Conflict` until the backfill job has run.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/templates.yaml#/TemplatePatch"
          examples:
            renameAndMove:
              summary: Rename the template and move layer 0
              description: |
                Typical edit — rename and reposition. The flat columns pick up
                the new name/x/y/scale from layer 0 after the ops apply.
              value:
                expectedVersion: 3
                doc:
                  name: "New name"
                layerOps:
                  - op: update
                    index: 0
                    patch:
                      name: "New name"
                      x: 120
                      y: 48
                      scale: 1
    responses:
      "200":
        description: Template updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/Template"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        $ref: "../components/responses/common.yaml#/Conflict"
  delete:
    tags: [Templates]
    summary: Delete a template
    operationId: deleteTemplate
    description: |
      Deletes a template. Authorization rules (evaluated in order):

      1. **Global moderator+** — may delete any template regardless of scope.
      2. **Clan moderator+** (of the template's clan) — may delete any
         clan-scoped template in their clan.
      3. **Author (own template)** — may delete their own template in any scope,
         subject to the following restriction:
         - For `clan`-scoped templates, deletion is blocked when the clan's
           `moderationPreferences.membersCanDeleteOwnTemplates` is false;
           only clan moderator+ can then delete within that clan. Returns
           `403 Forbidden` in that case.

      Private and public scopes have no clan-level restriction — authors may
      always delete their own.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Template deleted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

TemplatePreview:
  get:
    tags: [Templates]
    summary: Get template layer preview thumbnail
    operationId: getTemplatePreview
    description: |
      Returns a square WebP thumbnail of a single layer from the stored
      the-wall-dev/2 document. The layer is scaled server-side before the
      thumbnail is generated, so the preview reflects the actual on-canvas
      appearance (Charity and other consumers have no native `scale` field).
      Defaults to layer 0 and size 128. Public approved templates are
      readable without authentication; clan/private templates require auth,
      session, or password (the `?session` and `?password` query params power
      share links). The document access block (`usersWhitelist` /
      `usersBlocklist` / `allowedToEdit`) is enforced on render; when the
      caller may not view the template the server returns `404` (not `403`) so
      it never leaks the template's existence.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
      - name: size
        in: query
        description: Thumbnail side length.
        schema:
          type: integer
          enum: [64, 128, 256]
          default: 128
      - name: layer
        in: query
        description: Zero-based layer index in document.templates[].
        schema:
          type: integer
          minimum: 0
          default: 0
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Preview image (WebP).
        content:
          image/webp:
            schema:
              type: string
              format: binary
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

TemplatePng:
  get:
    tags: [Templates]
    summary: Get template layer as PNG
    operationId: getTemplatePng
    description: |
      Renders a single layer from the stored the-wall-dev/2 document as a
      PNG image. The layer's `scale` is applied server-side because Charity
      and similar tools cannot scale images themselves. Use `?layer={idx}` to
      select a layer other than the first one. Public approved templates are
      readable without authentication; clan/private templates require auth,
      session, or password (the `?session` and `?password` query params power
      share links). The document access block (`usersWhitelist` /
      `usersBlocklist` / `allowedToEdit`) is enforced on render; when the
      caller may not view the template the server returns `404` (not `403`) so
      it never leaks the template's existence.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
      - name: layer
        in: query
        description: Zero-based layer index in document.templates[].
        schema:
          type: integer
          minimum: 0
          default: 0
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Layer rendered as PNG.
        content:
          image/png:
            schema:
              type: string
              format: binary
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

TemplateAnimated:
  get:
    tags: [Templates]
    summary: Get template layer as an animated GIF
    operationId: getTemplateAnimated
    description: |
      Renders a layer's sprite-sheet animation (its `animation` block in the
      the-wall-dev/2 document) as an animated GIF. Honours the sheet layout and
      traversal order, per-frame durations, skipped frames, per-frame image
      overrides, and the looping flag. Layers with no `animation` block fall
      back to a single still PNG, so this endpoint is always safe to point an
      `<img>` at. Public approved templates are readable without authentication;
      clan/private templates require auth, session, or password (the `?session`
      and `?password` query params power share links). The document access block
      (`usersWhitelist` / `usersBlocklist` / `allowedToEdit`) is enforced on
      render; when the caller may not view the template the server returns `404`
      (not `403`) so it never leaks the template's existence.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
      - name: layer
        in: query
        description: Zero-based layer index in document.templates[].
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        description: >
          Fit each frame into a size×size box (nearest-neighbour, aspect
          preserved). Omit to render at native frame size (capped at 512px).
        schema:
          type: integer
          minimum: 1
          maximum: 512
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: >
          Animated GIF (animated layers) or still PNG (static layers).
        content:
          image/gif:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "422":
        description: Animation timeline resolved to zero visible frames.

TemplateCharity:
  get:
    tags: [Templates]
    summary: Export template as Charity format
    operationId: getTemplateCharity
    description: |
      Returns the template derived into the third-party Charity
      (Bluemarble-style) JSON format for cross-client compatibility.
      The stored canonical form is always the-wall-dev/2; this response
      is assembled on demand. Conversion is lossy — some v2 features
      (per-frame image overrides, access control, contacts) are not
      expressible in the Charity format.

      Each Charity entry's `sources` array is prepended with a backend
      `/api/v3/templates/{id}/png?layer={idx}` URL because Charity cannot
      consume `data:` URLs and has no native `scale` field; the PNG endpoint
      bakes the layer's scale into the rendered image. Public approved
      templates are readable without authentication; clan/private templates
      require auth, session, or password (the `?session` and `?password` query
      params power share links). The document access block (`usersWhitelist` /
      `usersBlocklist` / `allowedToEdit`) is enforced on export; when the caller
      may not view the template the server returns `404` (not `403`) so it never
      leaks the template's existence.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Charity format derived from the stored the-wall-dev/2 document.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/CharityConfig"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

TemplateWallDev:
  get:
    tags: [Templates]
    summary: Get template as native the-wall-dev/2 document
    operationId: getTemplateWallDev
    description: |
      Returns the stored the-wall-dev/2 document directly. This is the
      canonical stored form — no conversion is applied. Includes full
      metadata, animation, access control, contacts, and multi-source
      image fallback lists. Public approved templates are readable without
      authentication; clan/private templates require auth, session, or password
      (the `?session` and `?password` query params power share links). The
      document access block (`usersWhitelist` / `usersBlocklist` /
      `allowedToEdit`) is enforced on export; when the caller may not view the
      template the server returns `404` (not `403`) so it never leaks the
      template's existence.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/TemplateIdPath"
      - $ref: "../components/parameters/common.yaml#/SessionQuery"
      - $ref: "../components/parameters/common.yaml#/PasswordQuery"
      - name: If-None-Match
        in: header
        description: |
          Conditional GET. Pass the ETag value from a previous response to
          receive 304 Not Modified when the document has not changed.
        schema:
          type: string
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Native the-wall-dev/2 document.
        headers:
          ETag:
            description: Strong ETag — format `"<id>-v<version>"`. Pass as `If-None-Match` on subsequent requests.
            schema:
              type: string
          Cache-Control:
            description: Always `private, must-revalidate`.
            schema:
              type: string
        content:
          application/json:
            schema:
              $ref: "../components/schemas/templates.yaml#/WallDevDocument"
      "304":
        description: Not Modified. The document has not changed since the supplied ETag.
        headers:
          ETag:
            description: Current ETag (same value that was submitted in If-None-Match).
            schema:
              type: string
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

