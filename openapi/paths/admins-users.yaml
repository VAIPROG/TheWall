      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

# ══════════════════════════════════════════════════════════════════════
# ADMINS — Clan Governance Overrides
# ══════════════════════════════════════════════════════════════════════

AdminClanMemberRole:
  post:
    tags: [Admins]
    summary: Override a clan member's role (admin)
    operationId: adminSetClanMemberRole
    description: |
      Sets the clan role of any active clan member without the caller
      needing to be a member of that clan. Global `admin` or higher.

      **Constraints:**
      - `role` must be `member`, `moderator`, or `admin`; `owner` is not
        valid — use `POST /admin/clans/{clanId}/transfer-owner` instead.
      - Returns `409 Conflict` if the target user is the clan owner.
      - Returns `404 Not Found` if the user has no active membership in
        the clan.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: clanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Clan UUID.
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/AdminClanRoleRequest"
    responses:
      "200":
        description: Clan role updated.
        content:
          application/json:
            schema:
              type: object
              required: [ok, clanId, userId, role]
              properties:
                ok: { type: boolean, example: true }
                clanId:
                  type: string
                  format: uuid
                  description: Clan UUID.
                userId:
                  type: string
                  format: uuid
                  description: Account UUID of the member whose role was changed.
                role:
                  type: string
                  enum: [member, moderator, admin]
                  description: The newly assigned clan role.
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        description: |
          Conflict. The target user is the clan owner — use
          `transfer-owner` to change ownership.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/Error"

AdminClanTransferOwner:
  post:
    tags: [Admins]
    summary: Transfer clan ownership (admin)
    operationId: adminTransferClanOwner
    description: |
      Changes the owner of a clan without the caller needing to hold
      any rank inside that clan. Global `admin` or higher.

      The new owner must have an active membership (one is created
      automatically if absent). The previous owner is stepped down
      to `admin` inside the clan. The one-clan-per-owner invariant
      is enforced — returns `409 Conflict` if the target already
      owns another clan.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: clanId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Clan UUID.
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/AdminTransferOwnerRequest"
    responses:
      "200":
        description: Ownership transferred.
        content:
          application/json:
            schema:
              type: object
              required: [ok, clanId, ownerId]
              properties:
                ok: { type: boolean, example: true }
                clanId:
                  type: string
                  format: uuid
                  description: Clan UUID.
                ownerId:
                  type: string
                  format: uuid
                  description: Account UUID of the new owner.
                previousOwnerId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Account UUID of the former owner (null if the clan had no owner).
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        description: Target user already owns another clan.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/Error"
