# ══════════════════════════════════════════════════════════════════════
# ADMINS — User Management Operations
# ══════════════════════════════════════════════════════════════════════

AdminUsers:
  get:
    tags: [Admins]
    summary: List / search users
    operationId: adminListUsers
    description: |
      Paginated, filterable list of all users. Global `admin` or higher.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - name: q
        in: query
        schema:
          type: string
        description: Free-text match against username, display name, or external id.
      - name: role
        in: query
        schema:
          type: string
          enum: [member, moderator, admin, owner]
        description: Filter by global role.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Paginated user list.
        content:
          application/json:
            schema:
              type: object
              required: [users, page, limit, total]
              properties:
                users:
                  type: array
                  items:
                    $ref: "../components/schemas/users.yaml#/User"
                page: { type: integer }
                limit: { type: integer }
                total: { type: integer }
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"

AdminUserById:
  get:
    tags: [Admins]
    summary: Get full admin view of a user
    operationId: adminGetUser
    description: |
      Returns the complete user record including internal fields,
      all sessions, restrictions, and audit history.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Full admin user view.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/admins.yaml#/AdminUserView"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  patch:
    tags: [Admins]
    summary: Update user info (admin override)
    operationId: adminUpdateUser
    description: |
      Directly modifies user fields bypassing normal validation limits.
      Logged in audit trail.

      **Role elevation rule:** setting `role` to `admin` or `owner` requires
      the caller to hold the `owner` global role. A plain `admin` caller
      receives `403 Forbidden`. Invalid role strings return `400 Bad Request`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/AdminUserUpdate"
    responses:
      "200":
        description: User updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/users.yaml#/User"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  delete:
    tags: [Admins]
    summary: Permanently delete a user
    operationId: adminDeleteUser
    description: |
      Irreversibly removes the user account and all associated data.
      Requires confirmation in the request body.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/ConfirmationRequest"
    responses:
      "200":
        description: User deleted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserBan:
  post:
    tags: [Admins]
    summary: Ban a user
    operationId: adminBanUser
    description: |
      Applies a global ban restriction to the user. Optionally
      specify duration, reason, and whether to wipe their content.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/BanRequest"
    responses:
      "200":
        description: User banned.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/restrictions.yaml#/RestrictionSet"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  delete:
    tags: [Admins]
    summary: Unban a user
    operationId: adminUnbanUser
    description: Removes the active ban restriction from the user.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: User unbanned.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserMute:
  post:
    tags: [Admins]
    summary: Mute a user
    operationId: adminMuteUser
    description: |
      Applies a global mute restriction. The user cannot send
      messages in any chat until the mute expires or is removed.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/MuteRequest"
    responses:
      "200":
        description: User muted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/restrictions.yaml#/RestrictionSet"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
  delete:
    tags: [Admins]
    summary: Unmute a user
    operationId: adminUnmuteUser
    description: Removes the active mute restriction.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: User unmuted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserPromote:
  post:
    tags: [Admins]
    summary: Promote / demote a user's global role
    operationId: adminPromoteUser
    description: |
      Changes the user's global server role. Only `owner` can
      promote to `admin`. Admins can promote to `moderator`.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/PromoteRequest"
    responses:
      "200":
        description: Role updated.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/users.yaml#/User"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserWipeout:
  post:
    tags: [Admins]
    summary: Wipe all user content
    operationId: adminWipeoutUser
    description: |
      Removes all templates, messages, and uploads created by this
      user. The user account itself is preserved.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/ConfirmationRequest"
    responses:
      "200":
        description: User content wiped.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserRemoveFromClan:
  post:
    tags: [Admins]
    summary: Force-remove user from their clan
    operationId: adminRemoveFromClan
    description: |
      Removes the user from their current clan regardless of their
      clan role.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: User removed from clan.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/common.yaml#/SuccessMessage"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserImpersonate:
  post:
    tags: [Admins]
    summary: Create an impersonation session
    operationId: adminImpersonate
    description: |
      Creates a temporary session acting as the target user.
      Time-limited (default 1 hour) and clearly marked in audit log.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/UserRefPath"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    requestBody:
      content:
        application/json:
          schema:
            $ref: "../components/schemas/admins.yaml#/ImpersonateRequest"
    responses:
      "200":
        description: Impersonation session created.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "403":
        $ref: "../components/responses/common.yaml#/Forbidden"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"

AdminUserResetAvatar:
