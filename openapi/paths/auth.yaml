# ══════════════════════════════════════════════════════════════════════
# AUTH — Authentication, OAuth, Session Lifecycle
# ══════════════════════════════════════════════════════════════════════

AuthSite:
  post:
    tags: [Auth]
    summary: Authenticate via site cookie (attach-or-create)
    operationId: authSite
    description: |
      Primary authentication method. Server verifies the site `token` with
      the named `site` platform to resolve `(site, siteUserId)`.

      **Attach-or-create semantics:**
      - If a valid Bearer session is present AND `(site, siteUserId)` is not
        yet linked to the current account → **attach** a new `SiteIdentity`
        to the current account and return the existing session.
      - Otherwise → **find or create** the Wall-Dev account for
        `(site, siteUserId)` and return a new session.

      `site` is the platform registry id shared with the site-injector adapter
      (e.g. `filianislost`, `wplace`). Not a closed enum — new platforms are
      added without an API version bump.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/AuthSiteRequest"
          example:
            site: filianislost
            token: "s%3AqX2v...site-session-cookie-value"
    responses:
      "200":
        description: Successfully authenticated (or site identity attached).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
            example:
              accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
              refreshToken: "8f14e45fceea167a5a36dedd4bea2543..."
              expiresIn: 3600
              tokenType: Bearer
              user:
                id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                username: "snackers_fan"
                displayName: "Snackers Fan"
                role: user
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

OAuthStart:
  get:
    tags: [Auth]
    summary: Start OAuth authorization-code + PKCE flow
    operationId: oauthStart
    description: |
      Begins the OAuth2 authorization-code flow for the given `provider`.

      The backend generates a PKCE code-verifier server-side, stores it
      against a single-use, short-lived `state` token, and returns the
      provider's `authorizeUrl` for the client to redirect to. The `state`
      token also encodes the `intent` and, when `intent=link`, the current
      `accountId` from the authenticated session.

      **PKCE is handled entirely server-side** — clients never see the
      code-verifier or code-challenge.

      For `intent=link` an authenticated session is required (Bearer token
      must be present); the endpoint returns `401` otherwise.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/OAuthProviderPath"
      - name: intent
        in: query
        required: true
        description: >-
          OAuth flow intent. `login` authenticates or creates an account;
          `link` attaches the provider identity to the current account
          (requires an active session).
        schema:
          $ref: "../components/schemas/auth.yaml#/OAuthIntent"
      - name: redirectUri
        in: query
        required: false
        description: >-
          Where the browser should be sent after the callback completes.
          If omitted the server uses a default post-auth landing URL.
        schema:
          type: string
    security:
      - {}
      - BearerAuth: []
    responses:
      "200":
        description: |
          Authorization URL ready. Redirect the user's browser to
          `authorizeUrl`. Alternatively the server may issue a `302`
          directly if the client supports it.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/OAuthStartResponse"
      "302":
        description: Direct redirect to the provider authorization page.
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        description: |
          `intent=link` was requested but no authenticated session is
          present. Provide a valid Bearer token.
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

OAuthCallback:
  post:
    tags: [Auth]
    summary: Handle OAuth provider callback
    operationId: oauthCallback
    description: |
      Completes the OAuth2 authorization-code + PKCE flow. The static
      callback page captures `code` and `state` from the provider redirect
      and POSTs them here as a JSON body — this keeps tokens out of the URL
      and avoids server-side redirects.

      The server:
      1. Validates the `state` (single-use, checks expiry and CSRF).
      2. Looks up the stored PKCE code-verifier for this state token.
      3. Exchanges the `code` for provider tokens entirely server-side
         (PKCE code-verifier is included in the exchange).
      4. Resolves the provider user identity.
      5. Executes the stored intent:
         - **login**: finds the Wall-Dev account linked to this provider
           identity and returns `AuthResponse` with a fresh session pair.
           Returns `404` if no account is linked (link it first).
         - **link**: upserts the provider identity onto the authenticated
           account and returns `AuthResponse` confirming the link.

      Returns `409` when the provider identity is already bound to a
      **different** account.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
      - $ref: "../components/parameters/common.yaml#/OAuthProviderPath"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/OAuthCallbackBody"
    responses:
      "200":
        description: |
          OAuth flow completed successfully. Body is `AuthResponse` for
          both `login` and `link` intents.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "404":
        description: >-
          `intent=login`: no Wall-Dev account is linked to this provider
          identity. Link the provider from the extension or overlay first.
        $ref: "../components/responses/common.yaml#/NotFound"
      "409":
        description: >-
          The resolved provider identity is already linked to a different
          Wall-Dev account. The client should prompt the user to unlink
          first or use a different provider account.
        $ref: "../components/responses/common.yaml#/Conflict"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

AuthRefresh:
  post:
    tags: [Auth]
    summary: Refresh session token
    operationId: authRefresh
    description: |
      Exchanges a valid refresh token for a new access + refresh
      token pair. The old refresh token is invalidated immediately.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/RefreshRequest"
    responses:
      "200":
        description: Tokens refreshed successfully.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

AuthSession:
  get:
    tags: [Auth]
    summary: Introspect current session
    operationId: authSession
    description: |
      Returns the identity behind the current token: the public account
      record (`user`), every linked site identity (`siteIdentities` — one per
      pixel-canvas platform the account is attached to), and every linked
      OAuth provider (`providers` — Telegram, Discord, GitHub). This is the
      canonical "who am I" call clients make on startup to hydrate their
      account state.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "200":
        description: Session information.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/SessionInfo"
            example:
              user:
                id: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                username: "snackers_fan"
                displayName: "Snackers Fan"
                role: user
              siteIdentities:
                - id: "0a1b2c3d-4e5f-6071-8293-a4b5c6d7e8f9"
                  accountId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  source: filianislost
                  externalId: "usr_193562"
                  siteUsername: "snackers_fan"
                  linkedAt: "2026-05-01T18:22:00Z"
                  lastSeenAt: "2026-07-18T07:45:12Z"
              providers:
                - id: "1b2c3d4e-5f60-7182-93a4-b5c6d7e8f90a"
                  accountId: "7c9e6679-7425-40de-944b-e07fc1f90ae7"
                  provider: discord
                  providerUid: "280903102874845184"
                  username: "snackers_fan#0"
                  isVerified: true
                  isPublic: false
                  linkedAt: "2026-05-02T10:00:00Z"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

AuthLogout:
  post:
    tags: [Auth]
    summary: Logout (invalidate all sessions)
    operationId: authLogout
    description: |
      Invalidates **all** active sessions for the current account — the one
      making this request and every other device. There is no per-session
      logout in V3; a subsequent request with any previously issued token
      returns `401`. The client should discard stored access and refresh
      tokens after this call.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
      - ApiKeyAuth: []
    responses:
      "204":
        description: All sessions invalidated. No response body.
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"

AuthMergeInitiate:
  post:
    tags: [Auth]
    summary: Initiate account merge (mint merge token for account B)
    operationId: authMergeInitiate
    description: |
      Called while authenticated as account **B** (the account to be absorbed).
      Returns a short-lived, single-use merge token (`scope=merge`,
      `subject=B`) to be submitted by account **A** at
      `POST /users/me/merge`.

      The token expires in ~10 minutes and can only be used once.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    security:
      - BearerAuth: []
    responses:
      "200":
        description: Merge token minted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/MergeInitiateResponse"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"

AuthRecover:
  post:
    tags: [Auth]
    summary: Recover account via mnemonic phrase
    operationId: authRecover
    description: |
      Verifies the 8-word BIP-39-style recovery phrase against the stored
      argon2id hash. On success, mints a **limited-scope recovery session**
      (AuthResponse) that may be used to re-link a provider or site identity,
      but cannot perform other account mutations until a full re-auth.

      No authentication required. Rate-limited aggressively.
    parameters:
      - $ref: "../components/parameters/common.yaml#/ClientVersionHeader"
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/auth.yaml#/RecoverRequest"
    responses:
      "200":
        description: Recovery session minted.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/auth.yaml#/AuthResponse"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "401":
        $ref: "../components/responses/common.yaml#/Unauthorized"
      "429":
        $ref: "../components/responses/common.yaml#/TooManyRequests"
