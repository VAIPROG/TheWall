<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Swagger UI · The Wall Dev API</title>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    @font-face { font-family: W95FA; src: url("/assets/font/W95FA.otf") format("opentype"); font-display: swap; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #101828; color: #e0e4ea; }

    /* ---- Win95 taskbar ---- */
    .topbar {
      position: sticky; top: 0; z-index: 200;
      display: flex; align-items: center; gap: 0;
      padding: 0;
      background: #c0c0c0;
      border-top: 2px solid #fff;
      border-bottom: 2px solid #404040;
      font-family: W95FA, "MS Sans Serif", monospace; font-size: 13px;
      box-shadow: 0 2px 6px rgba(0,0,0,.5);
    }
    .topbar .start-btn {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px 3px 4px;
      background: #c0c0c0;
      border: 2px solid; border-color: #fff #404040 #404040 #fff;
      font-weight: bold; color: #000; cursor: default;
      margin: 2px 4px;
    }
    .topbar .start-btn .win-logo {
      width: 16px; height: 16px;
      background: linear-gradient(135deg, #f00 25%, #0f0 25%, #0f0 50%, #00f 50%, #00f 75%, #ff0 75%);
    }
    .topbar .divider {
      width: 2px; align-self: stretch; margin: 3px 2px;
      border-left: 1px solid #808080; border-right: 1px solid #fff;
    }
    .topbar a {
      color: #000; text-decoration: none; padding: 4px 10px;
      border: 1px solid transparent;
    }
    .topbar a:hover {
      border-color: #fff #404040 #404040 #fff;
      background: #d4d0c8;
    }
    .topbar .spacer { flex: 1; }
    .topbar .clock {
      padding: 3px 10px; margin: 2px 4px;
      border: 2px solid; border-color: #808080 #fff #fff #808080;
      background: #c0c0c0; font-size: 12px; color: #000;
    }

    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* Dark theme overrides for Swagger UI */
    .swagger-ui { font-family: W95FA, monospace; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui,
    .swagger-ui .scheme-container,
    .swagger-ui .opblock-tag { background: transparent; }

    .swagger-ui .info .title,
    .swagger-ui .opblock-tag,
    .swagger-ui .opblock .opblock-summary-method,
    .swagger-ui table thead tr th,
    .swagger-ui .parameter__name,
    .swagger-ui .response-col_status { color: #e0e4ea; }

    .swagger-ui .info .title small { background: #2a7; }
    .swagger-ui .info p,
    .swagger-ui .info li,
    .swagger-ui .opblock-description-wrapper p,
    .swagger-ui .opblock-body pre,
    .swagger-ui .parameter__type,
    .swagger-ui .response-col_description,
    .swagger-ui table tbody tr td { color: #b8c4d4; }

    .swagger-ui .btn { border-color: #3a4a60; color: #bcd; }
    .swagger-ui .btn:hover { background: #1a2e4a; }
    .swagger-ui .btn.authorize { border-color: #66bb6a; color: #66bb6a; }

    .swagger-ui .opblock.opblock-get { background: rgba(30,90,160,.12); border-color: #1e5aa0; }
    .swagger-ui .opblock.opblock-get .opblock-summary-method { background: #1e5aa0; }
    .swagger-ui .opblock.opblock-post { background: rgba(76,175,80,.08); border-color: #388e3c; }
    .swagger-ui .opblock.opblock-post .opblock-summary-method { background: #388e3c; }
    .swagger-ui .opblock.opblock-put { background: rgba(255,152,0,.08); border-color: #f57c00; }
    .swagger-ui .opblock.opblock-put .opblock-summary-method { background: #f57c00; }
    .swagger-ui .opblock.opblock-delete { background: rgba(244,67,54,.08); border-color: #d32f2f; }
    .swagger-ui .opblock.opblock-delete .opblock-summary-method { background: #d32f2f; }

    .swagger-ui .opblock .opblock-summary-path,
    .swagger-ui .opblock .opblock-summary-description { color: #b8c4d4; }
    .swagger-ui .opblock-body pre.microlight { background: #0d1b2a; color: #9fc; }

    /* Section header dark fix */
    .swagger-ui .opblock-section-header {
      background: #0d1b2a !important;
      border-color: #2a3650 !important;
    }
    .swagger-ui .opblock-section-header h4,
    .swagger-ui .opblock-section-header label { color: #b8c4d4 !important; }

    /* JSON schema expand button */
    .swagger-ui .json-schema-2020-12-expand-deep-button,
    .swagger-ui .model-toggle { background: #1a2540 !important; color: #7bf !important; border-color: #3a4a60 !important; }

    .swagger-ui .model-box,
    .swagger-ui section.models { background: #0d1b2a; border-color: #2a3650; }
    .swagger-ui section.models h4 { color: #e0e4ea !important; }
    .swagger-ui .model { color: #b8c4d4; }
    .swagger-ui .model-title { color: #7bf; }
    .swagger-ui select { background: #1a2540; color: #e0e4ea; border-color: #3a4a60; }
    .swagger-ui input[type=text] { background: #1a2540; color: #e0e4ea; border-color: #3a4a60; }
    .swagger-ui .scheme-container { background: #0d1b2a; box-shadow: none; }
    .swagger-ui .loading-container .loading::after { color: #7bf; }

    /* Tab panels */
    .swagger-ui .tab li { background: #0d1b2a !important; color: #99a8b8 !important; border-color: #2a3650 !important; }
    .swagger-ui .tab li.active { background: #1a2a44 !important; color: #e0e4ea !important; }

    /* Response section */
    .swagger-ui .responses-inner { background: transparent; }
    .swagger-ui .response { border-color: #2a3650; }
  </style>
</head>
<body>
<div class="topbar">
  <div class="start-btn"><div class="win-logo"></div> API</div>
  <div class="divider"></div>
  <a href="/">Home</a>
  <a href="/api-docs/">Docs</a>
  <a href="/api-docs/redoc.html">ReDoc</a>
  <a href="/openapi.yaml">spec.yaml</a>
  <span class="spacer"></span>
  <div class="clock">v2.1</div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.ui = SwaggerUIBundle({
  url: '/openapi.yaml',
  dom_id: '#swagger-ui',
  deepLinking: true,
  presets: [SwaggerUIBundle.presets.apis],
  layout: 'BaseLayout',
  tryItOutEnabled: true,
  persistAuthorization: true,
  defaultModelsExpandDepth: 2,
  docExpansion: 'list',
});
</script>
</body>
</html>
