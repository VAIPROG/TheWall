      operationId: listTemplates
      description: |
        Paginated, filterable template discovery. Public approved templates are
        listed without authentication. Clan and private templates are only
        included when the caller is authenticated (Bearer, API key, or session).
        Filter by scope, status, author, clan, position range, text search.
