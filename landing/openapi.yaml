              - clan
              - private
        - name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
        - name: search
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
            format: uuid
