            schema:
              $ref: '#/components/schemas/ModAction'
      responses:
        '200':
          description: Template approved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /moderation/queue/{templateId}/reject:
    post:
      tags:
        - Moderation
      summary: Reject a template
      operationId: rejectTemplate
      description: Rejects with reason. Author is notified.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/TemplateIdPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModAction'
      responses:
        '200':
          description: Template rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /moderation/audit-log:
    get:
      tags:
        - Moderation
      summary: Moderation audit log
      operationId: getModAuditLog
      description: |
        Log of all moderation actions. Distinct from admin audit log.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Moderation audit log.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /moderation/clans/{clanId}/takedown:
    post:
      tags:
        - Moderation
      summary: Takedown clan presentation fields
      operationId: clanTakedown
      description: |
        Strips (and optionally locks) one or more presentation fields on the
        specified clan. Requires global `moderator` role or higher.

        The action never deletes the clan — it only clears and/or locks the
        specified `ClanLockableField` values so that clan-level roles cannot
        restore them. When `action` is `strip_and_lock` (default), the fields
        are recorded in `Clan.moderation.lockedFields` and the `423 Locked`
        response is returned to clan-level update attempts until unlocked via
        `POST /moderation/clans/{clanId}/unlock`.

        The action and reason are recorded in the moderation audit log.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ClanIdPath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClanTakedownRequest'
      responses:
        '200':
          description: Takedown applied. Returns the updated clan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /moderation/clans/{clanId}/unlock:
    post:
      tags:
        - Moderation
      summary: Unlock clan presentation fields
      operationId: clanUnlock
      description: |
        Removes a global-moderation field lock from the specified clan, allowing
        clan-level roles to modify those fields again. Requires global `moderator`
        role or higher.

        Only fields currently listed in `Clan.moderation.lockedFields` are affected;
        unlisting a field that is not locked is a no-op. The action and reason are
        recorded in the moderation audit log.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ClanIdPath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClanUnlockRequest'
      responses:
        '200':
          description: Lock released. Returns the updated clan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /telemetry/events:
    post:
      tags:
        - Telemetry
      summary: Submit client telemetry events
      operationId: submitTelemetry
      description: |
        Ingests telemetry events. Only accepted from users with
        `telemetryOptIn: true`. Request body is a batch of events.
        Data is never sold or shared.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryBatch'
      responses:
        '202':
          description: Events accepted for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /telemetry/health:
    get:
      tags:
        - Telemetry
      summary: Server health check
      operationId: healthCheck
      description: |
        Publicly accessible. Returns 200 when healthy, 503 when
        in maintenance or degraded. Includes uptime, DB connectivity,
        and maintenance status.
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
        '503':
          description: Server is in maintenance or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /telemetry/metrics:
    get:
      tags:
        - Telemetry
      summary: Detailed server metrics
      operationId: getMetrics
      description: |
        Admin only. Supports Prometheus (`Accept: text/plain`)
        or JSON (`Accept: application/json`).
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server metrics.
          content:
            text/plain:
              schema:
                type: string
                description: Prometheus exposition format.
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /telemetry/logs:
    post:
      tags:
        - Telemetry
      summary: Upload structured logs or crash reports
      operationId: telemetryUploadLogs
      description: |
        Client uploads a batch of structured log entries or crash reports for
        server-side analysis. Honouring the user's telemetry opt-in setting;
        entries from opted-out users may be dropped silently. The endpoint is
        rate-limited and enforces a maximum payload size; large batches should
        be split into multiple requests.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogBatch'
      responses:
        '200':
          description: Batch processed; counts of accepted and rejected entries returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogIngestResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags:
        - Telemetry
      summary: Query stored log records (admin)
      operationId: telemetryQueryLogs
      description: |
        Returns stored log records with optional filtering. Requires a global
        admin or owner role. Supports cursor-based pagination via `cursor` and
        `limit` parameters. IP addresses are included in each record only for
        callers with global admin / owner authority.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - name: level
          in: query
          description: Filter by log severity level.
          schema:
            type: string
            enum:
              - trace
              - debug
              - info
              - warn
              - error
              - fatal
        - name: from
          in: query
          description: Include only records with `timestamp` at or after this value (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Include only records with `timestamp` at or before this value (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: userRef
          in: query
          description: Filter by uploader. Accepts a UUID or a username (case-insensitive); UUID parsing takes precedence.
          schema:
            type: string
        - name: sessionId
          in: query
          description: Filter by client session identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          description: Filter by the module or component name recorded in `source`.
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search across the `message` field.
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque pagination cursor from a previous response's `nextCursor`.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of records to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Paginated list of log records matching the applied filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /telemetry/logs/export:
    get:
      tags:
        - Telemetry
      summary: Export log records as NDJSON or CSV (admin)
      operationId: telemetryExportLogs
      description: |
        Streams all log records matching the supplied filters as NDJSON
        (`application/x-ndjson`) or CSV (`text/csv`). Requires a global admin
        or owner role. Accepts the same filter parameters as
        `GET /telemetry/logs`. The response is streamed; callers should expect
        chunked transfer encoding for large exports.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - name: level
          in: query
          description: Filter by log severity level.
          schema:
            type: string
            enum:
              - trace
              - debug
              - info
              - warn
              - error
              - fatal
        - name: from
          in: query
          description: Include only records with `timestamp` at or after this value (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Include only records with `timestamp` at or before this value (ISO 8601).
          schema:
            type: string
            format: date-time
        - name: userRef
          in: query
          description: Filter by uploader. Accepts a UUID or a username (case-insensitive); UUID parsing takes precedence.
          schema:
            type: string
        - name: sessionId
          in: query
          description: Filter by client session identifier (UUID).
          schema:
            type: string
            format: uuid
        - name: source
          in: query
          description: Filter by the module or component name recorded in `source`.
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search across the `message` field.
          schema:
            type: string
        - name: format
          in: query
          description: Output serialisation format for the export stream.
          schema:
            type: string
            enum:
              - ndjson
              - csv
            default: ndjson
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Streamed NDJSON or CSV export of matching log records. The `Content-Type` header reflects the requested `format`.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: Newline-delimited JSON stream; each line is a JSON-serialised `LogRecord` object.
            text/csv:
              schema:
                type: string
                description: CSV export with a header row. Column order matches the `LogRecord` field order.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Short-lived session token obtained via `POST /auth/site` or
        `POST /auth/refresh`. Include in every request:
        ```
        Authorization: Bearer <token>
        ```
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: |
        Long-lived personal access token for integrations and bots.
        ```
        Authorization: ApiKey <key>
        ```
        Inherits full permissions of the owning user account.
        **Never share with untrusted parties.**
  parameters:
    ClientVersionHeader:
      name: X-ClientVersion-TheWallDev-API
      in: header
      required: true
      description: Client application version. Must be 3.
      schema:
        type: integer
        enum:
          - 3
    OAuthProviderPath:
      name: provider
      in: path
      required: true
      description: OAuth provider id.
      schema:
        type: string
        enum:
          - telegram
          - discord
          - github
    PageParam:
      name: page
      in: query
      description: Page number for pagination.
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPageParam:
      name: perPage
      in: query
      description: Number of items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserRefPath:
      name: userRef
      in: path
      required: true
      description: User UUID or username (case-insensitive). If the value parses as a UUID it is treated as an id, otherwise as a username (usernames are globally unique).
      schema:
        type: string
    ConnectionIdPath:
      name: connectionId
      in: path
      required: true
      description: Unique identifier of the connection.
      schema:
        type: string
        format: uuid
    KeyIdPath:
      name: keyId
      in: path
      required: true
      description: Unique identifier of the key.
      schema:
        type: string
        format: uuid
    ClanIdPath:
      name: clanId
      in: path
      required: true
      description: Unique identifier of the clan (UUID).
      schema:
        type: string
        format: uuid
    UserIdPath:
      name: userId
      in: path
      required: true
      description: Unique identifier of the user (UUID).
      schema:
        type: string
        format: uuid
    ChatIdPath:
      name: chatId
      in: path
      required: true
      description: Unique identifier of the chat.
      schema:
        type: string
        format: uuid
    MessageIdPath:
      name: messageId
      in: path
      required: true
      description: Unique identifier of the message.
      schema:
        type: string
        format: uuid
    SessionQuery:
      name: session
      in: query
      description: |
        Session token that grants the same access as a Bearer JWT. Useful for
        sharing a read-only link to a clan or private template without exposing
        the user's long-term credentials. The token is looked up in the active
        sessions table.
      schema:
        type: string
    TemplateIdPath:
      name: templateId
      in: path
      required: true
      description: Unique identifier of the template.
      schema:
        type: string
        format: uuid
    PasswordQuery:
      name: password
      in: query
      description: |
        Per-template share password. If the template owner set an access password,
        anyone with the id + password can fetch the template, regardless of its
        scope (clan or private). Public approved templates never require a password.
      schema:
        type: string
        minLength: 1
    RestrictionIdPath:
      name: restrictionId
      in: path
      required: true
      description: Unique identifier of the restriction.
      schema:
        type: string
        format: uuid
    ReportIdPath:
      name: reportId
      in: path
      required: true
      description: Unique identifier of the report.
      schema:
        type: string
        format: uuid
  schemas:
    AuthSiteRequest:
      type: object
      required:
        - site
        - token
      properties:
        site:
          type: string
          description: |
            Platform registry id — the same identifier used by the site-injector
            adapter. Extensible; do not enumerate closed.
          example: filianislost
        token:
          type: string
          description: Authentication token/cookie from the target site.
    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token.
        refreshToken:
          type: string
          description: Refresh token for obtaining new access tokens.
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
        tokenType:
          type: string
          default: Bearer
          description: Token type prefix.
        user:
          type: object
          required:
            - id
            - username
            - displayName
            - role
          properties:
            id:
              type: string
              format: uuid
              description: Unique account identifier (UUID).
            username:
              type: string
              description: Unique username.
            displayName:
              type: string
              description: User-visible display name.
            role:
              type: string
              description: User role.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Machine-readable error code in UPPER_SNAKE_CASE.
              example: INVALID_INPUT
            message:
              type: string
              description: Human-readable error description.
              example: The request body contains invalid fields.
            details:
              type: object
              nullable: true
              description: Additional error details.
              example: null
    OAuthIntent:
      type: string
      enum:
        - login
        - link
      description: |
        OAuth flow intent.
        - `login`: authenticate or create a Wall-Dev account for the provider identity and return a session.
        - `link`: attach this provider identity to the already-authenticated account (requires an active session).
    OAuthStartResponse:
      type: object
      required:
        - authorizeUrl
        - state
      properties:
        authorizeUrl:
          type: string
          format: uri
          description: Provider authorize URL to redirect the user to.
        state:
          type: string
          description: Single-use, short-lived token that binds the PKCE verifier, intent, and (for link) the current accountId. Must be round-tripped as-is to the callback.
    OAuthCallbackBody:
      type: object
      required:
        - code
        - state
      properties:
        code:
          type: string
          description: Authorization code received from the OAuth provider.
        state:
          type: string
          description: Single-use CSRF/PKCE binding token from `OAuthStart`. Must be round-tripped exactly as returned by the start endpoint.
    TelegramWidgetAuth:
      type: object
      required:
        - id
        - first_name
        - auth_date
        - hash
      description: |
        **Deprecated.** Signed payload from the legacy Telegram Login Widget.
        The server verifies the `hash` using the bot token secret.
        Prefer the modern OAuth2 flow via `GET /auth/oauth/telegram/start`.
      properties:
        id:
          type: integer
          description: Telegram user id.
        first_name:
          type: string
          description: User's first name as reported by Telegram.
        last_name:
          type: string
          nullable: true
          description: User's last name (optional).
        username:
          type: string
          nullable: true
          description: Telegram username (optional).
        photo_url:
          type: string
          nullable: true
          description: URL of the user's profile photo (optional).
        auth_date:
          type: integer
          description: Unix timestamp of authentication (used to check freshness).
        hash:
          type: string
          description: HMAC-SHA256 signature of the data fields, keyed with the bot token secret.
