components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    Unauthorized:
      description: Missing/invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        role: { type: string }
        clanId: { type: integer, nullable: true }
        discordId: { type: string }
        countryCode: { type: string }
    ChatMessage:
      type: object
      properties:
        id: { type: string }
        author: { type: string }
        authorId: { type: integer }
        text: { type: string, description: Raw markdown }
        createdAt: { type: integer, format: int64 }
    Template:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        author: { type: string }
        x: { type: integer }
        y: { type: integer }
        scale:
          type: number
          format: double
          minimum: 0.01
          maximum: 10000
          default: 1
        share: { type: string, description: "the-wall-dev:// import string" }
        createdAt: { type: integer, format: int64 }
    TemplateInput:
      type: object
      required: [name, x, y, share]
      properties:
        name: { type: string, maxLength: 64 }
        x: { type: integer }
        y: { type: integer }
        scale:
          type: number
          format: double
          minimum: 0.01
          maximum: 10000
          default: 1
        share: { type: string }
    Notification:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string, examples: [clan_chat, template_shared, system] }
        title: { type: string }
        body: { type: string }
        data: { type: object, additionalProperties: true }
        createdAt: { type: integer, format: int64 }
