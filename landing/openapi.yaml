          type: integer
          description: Number of SiteIdentities re-parented from B to A.
        movedTemplates:
          type: integer
          description: Number of templates whose author.id was rewritten B→A.
        unionedSocials:
          type: integer
          description: Number of SocialLinks moved from B to A (deduped by provider/uid).
        revokedApiKeys:
          type: integer
          description: Number of B's API keys revoked as part of the merge.
        conflicts:
          type: array
          items:
            type: string
          nullable: true
