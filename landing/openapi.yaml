          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /users/me/merge:
    post:
      tags:
        - Users
      summary: Merge account B into the current account (A)
      operationId: mergeIntoMe
      description: |
        Folds account **B** into the authenticated account **A**.
        Requires a `mergeToken` minted by `POST /auth/merge/initiate`
        while authenticated as B.

        **Effects:**
        - B's SiteIdentities are re-parented onto A. If A and B both hold an
          identity on the **same** site → `409 MERGE_SITE_CONFLICT`.
        - B's SocialLinks are unioned (deduplicated by provider/uid).
        - B's templates have `author.id` rewritten to A.
        - B's API keys are **revoked** (not transferred).
        - B is tombstoned; a UUID alias row (B→A) is kept for 90 days.

        **Irreversible** after the tombstone grace window. Explicit confirmation
        is built into the merge token (callers must have minted it knowingly).
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: Merge completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me/recovery/phrase:
    post:
      tags:
        - Users
      summary: Generate or rotate mnemonic recovery phrase
      operationId: generateMyRecoveryPhrase
      description: |
        Generates (or rotates) an 8-word BIP-39-style mnemonic recovery phrase
        for the current account. The phrase is returned **once** in this
        response — it cannot be retrieved again.

        The server stores only a salted argon2id hash of the normalised phrase.
        The phrase can be used at `POST /auth/recover` to obtain a recovery
        session when all other login factors are unavailable.

        Calling this endpoint rotates the phrase, invalidating any previous one.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Recovery phrase generated (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryPhraseResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
