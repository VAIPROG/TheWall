        the-wall-dev/2 document. The layer is scaled server-side before the
        thumbnail is generated, so the preview reflects the actual on-canvas
        appearance (Charity and other consumers have no native `scale` field).
        Defaults to layer 0 and size 128. Public approved templates are
        readable without authentication; clan/private templates require auth,
        session, or password.
      parameters:
