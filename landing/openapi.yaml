  /templates/{templateId}/verify:
    post:
      tags:
        - Templates
      summary: Approve or reject a template
      operationId: verifyTemplate
      description: |
        Submit a moderation decision (approve or reject) for a template.

        **Authorization**
        - Global moderator+ may verify any template regardless of scope.
        - Clan moderator+ of the template's clan may verify clan-scoped templates
          in their clan only. Attempting to verify a public or private template
          without global moderator+ returns `403 Forbidden`.

        **Effect**
        - `approve` → sets `status: approved`, records `verifiedBy` and `verifiedAt`.
        - `reject` → sets `status: rejected`, records `verifiedBy`, `verifiedAt`,
          and `rejectionReason` (from the request `reason` field).

        The response always returns the updated `Template` object so callers can
        observe the new `status`, `verifiedBy`, `verifiedAt`, and `rejectionReason`
        in a single round-trip.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/TemplateIdPath'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemplateVerifyRequest'
      responses:
        '200':
          description: Moderation decision recorded. Returns the updated template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
