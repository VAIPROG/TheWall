        Paginated list of reports. Filterable by status, type,
        and date range. Moderator+ only.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: status
          in: query
          schema:
            type: string
            enum:
              - open
              - reviewing
              - resolved
              - dismissed
        - name: type
          in: query
          schema:
            type: string
            enum:
              - template
              - message
              - user
              - clan
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /moderation/reports/{reportId}:
    get:
      tags:
        - Moderation
      summary: Get report details
      operationId: getReport
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ReportIdPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Report details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Moderation
      summary: Update report status
      operationId: updateReport
      description: Assign moderator, change status, or add notes.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ReportIdPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportUpdate'
      responses:
        '200':
          description: Report updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /moderation/reports/{reportId}/resolve:
    post:
      tags:
        - Moderation
      summary: Resolve a report
      operationId: resolveReport
      description: |
        Marks as resolved with a resolution action.
        Optionally creates a restriction as part of resolution.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ReportIdPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportResolve'
      responses:
        '200':
          description: Report resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /moderation/reports/{reportId}/dismiss:
    post:
      tags:
        - Moderation
      summary: Dismiss a report
      operationId: dismissReport
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/ReportIdPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDismiss'
      responses:
        '200':
          description: Report dismissed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /moderation/queue:
