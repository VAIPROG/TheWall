openapi: 3.0.3
info:
  title: The Wall Dev API
  version: 3.0.0
  description: |
    # The Wall Dev API v3

    High-performance, canvas-agnostic backend for pixel-battle overlays,
    clan coordination, template management, chat, moderation, and telemetry.
    Designed to be plugged into **any** pixel canvas platform — not limited
    to a single wall or game.

    ---

    ## Breaking Change: All Traffic Must Target `/api/v3`

    Starting with V3, **all endpoints live exclusively under the
    `/api/v3/` prefix**. Root-level endpoints (`/api/auth`, `/api/users`,
    etc.) that existed in V1 and V2 are **no longer maintained**.

    Legacy root-level routes will return `410 Gone` after 2026-09-01.

    ---

    ## Required Headers

    Every request to the V3 API **MUST** include:

    ```
    X-ClientVersion-TheWallDev-API: 3
    ```

    | Scenario | Server response |
    |---|---|
    | Header missing, endpoint exists in legacy V1/V2 | Best-effort compatible response (may be degraded). |
    | Header missing, endpoint is V3-only | `400 Bad Request`. |
    | Header value is unsupported | `400 Bad Request` with supported version info. |
    | Header present and valid | Normal V3 processing. |

    ---

    ## Authentication

    Two authentication methods via the `Authorization` header:

    ### Bearer Token (Session)
    ```
    Authorization: Bearer <token>
    ```

    ### API Key (Personal Access Token)
    ```
    Authorization: ApiKey <key>
    ```

    > **SECURITY WARNING**: API keys grant **full access** to your account.
    > NEVER share with untrusted parties. Revoke via
    > `DELETE /users/me/api-keys/{keyId}` if compromised.

    ---

    ## Rate Limiting

    Per-user and per-IP rate limits enforced via response headers:
    `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`,
    `X-RateLimit-AllowedAtPeak`.

    Exceeded limits return `429 Too Many Requests`.

    ---

    ## Error Format

    ```json
    {
      "error": {
        "code": "TEMPLATE_NOT_FOUND",
        "message": "The requested template does not exist.",
        "details": null
      }
    }
    ```

    | Field | Description |
    |---|---|
    | `code` | Machine-readable identifier (`UPPER_SNAKE_CASE`). |
    | `message` | Human-readable explanation (English). |
    | `details` | Optional additional context (object, array, or null). |
  contact:
    name: The Wall Dev
    url: https://github.com/Vadim-Khristenko/TheWall
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: https://the-wall.vai-rice.space/api/v3
    description: Production
  - url: http://localhost:8080/api/v3
    description: Local development
security:
  - BearerAuth: []
  - ApiKeyAuth: []
tags:
  - name: Auth
    description: |
      Authentication and session lifecycle. Handles site-token login,
      token refresh, logout, and session introspection.
  - name: Admins
    description: |
      Server-wide administrative operations. Reserved for `owner` or
      `admin` global roles. Split into user management and system ops.
  - name: Users
    description: |
      User profiles, settings, identity management, social account
      linking, API key lifecycle, and public profile lookups.
  - name: Clans
    description: |
      Clan creation, membership, governance. Hierarchical roles:
      owner, admin, moderator, member.
  - name: Chats
    description: |
      Real-time and asynchronous messaging. Chat rooms, DMs,
      clan channels, modmail, and message relay.
  - name: Templates
    description: |
      Template upload, discovery, sharing, access control. Core content
      unit with position, scale, animation, and access metadata.
  - name: Restrictions
    description: |
      Granular per-action moderation sanctions: mute, ban, template
      publish block, invite block, report block, modmail block.
  - name: Notifications
    description: |
      User-facing notification delivery, acknowledgement, bulk
      dismiss, and notification preferences.
  - name: Moderation
    description: |
      Report handling, mod queue, template approval, and
      moderation audit log. The process of reviewing reports.
  - name: Telemetry
    description: |
      Client telemetry ingestion, server health check, and
      Prometheus-compatible metrics.
paths:
  /auth/site:
    post:
      tags:
        - Auth
      summary: Authenticate via site cookie (attach-or-create)
      operationId: authSite
      description: |
        Primary authentication method. Server verifies the site `token` with
        the named `site` platform to resolve `(site, siteUserId)`.

        **Attach-or-create semantics:**
        - If a valid Bearer session is present AND `(site, siteUserId)` is not
          yet linked to the current account → **attach** a new `SiteIdentity`
          to the current account and return the existing session.
        - Otherwise → **find or create** the Wall-Dev account for
          `(site, siteUserId)` and return a new session.

        `site` is the platform registry id shared with the site-injector adapter
        (e.g. `filianislost`, `wplace`). Not a closed enum — new platforms are
        added without an API version bump.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSiteRequest'
      responses:
        '200':
          description: Successfully authenticated (or site identity attached).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/{provider}/start:
    get:
      tags:
        - Auth
      summary: Start OAuth authorization-code + PKCE flow
      operationId: oauthStart
      description: |
        Begins the OAuth2 authorization-code flow for the given `provider`.

        The backend generates a PKCE code-verifier server-side, stores it
        against a single-use, short-lived `state` token, and returns the
        provider's `authorizeUrl` for the client to redirect to. The `state`
        token also encodes the `intent` and, when `intent=link`, the current
        `accountId` from the authenticated session.

        **PKCE is handled entirely server-side** — clients never see the
        code-verifier or code-challenge.

        For `intent=link` an authenticated session is required (Bearer token
        must be present); the endpoint returns `401` otherwise.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/OAuthProviderPath'
        - name: intent
          in: query
          required: true
          description: OAuth flow intent. `login` authenticates or creates an account; `link` attaches the provider identity to the current account (requires an active session).
          schema:
            $ref: '#/components/schemas/OAuthIntent'
        - name: redirectUri
          in: query
          required: false
          description: Where the browser should be sent after the callback completes. If omitted the server uses a default post-auth landing URL.
          schema:
            type: string
      security:
        - {}
        - BearerAuth: []
      responses:
        '200':
          description: |
            Authorization URL ready. Redirect the user's browser to
            `authorizeUrl`. Alternatively the server may issue a `302`
            directly if the client supports it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStartResponse'
        '302':
          description: Direct redirect to the provider authorization page.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            `intent=link` was requested but no authenticated session is
            present. Provide a valid Bearer token.
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/{provider}/callback:
    post:
      tags:
        - Auth
      summary: Handle OAuth provider callback
      operationId: oauthCallback
      description: |
        Completes the OAuth2 authorization-code + PKCE flow. The static
        callback page captures `code` and `state` from the provider redirect
        and POSTs them here as a JSON body — this keeps tokens out of the URL
        and avoids server-side redirects.

        The server:
        1. Validates the `state` (single-use, checks expiry and CSRF).
        2. Looks up the stored PKCE code-verifier for this state token.
        3. Exchanges the `code` for provider tokens entirely server-side
           (PKCE code-verifier is included in the exchange).
        4. Resolves the provider user identity.
        5. Executes the stored intent:
           - **login**: finds the Wall-Dev account linked to this provider
             identity and returns `AuthResponse` with a fresh session pair.
             Returns `404` if no account is linked (link it first).
           - **link**: upserts the provider identity onto the authenticated
             account and returns `AuthResponse` confirming the link.

        Returns `409` when the provider identity is already bound to a
        **different** account.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/OAuthProviderPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackBody'
      responses:
        '200':
          description: |
            OAuth flow completed successfully. Body is `AuthResponse` for
            both `login` and `link` intents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`intent=login`: no Wall-Dev account is linked to this provider identity. Link the provider from the extension or overlay first.'
          $ref: '#/components/responses/NotFound'
        '409':
          description: The resolved provider identity is already linked to a different Wall-Dev account. The client should prompt the user to unlink first or use a different provider account.
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/oauth/telegram:
    post:
      tags:
        - Auth
      summary: Authenticate via Telegram Login Widget (legacy)
      operationId: oauthTelegramLegacy
      deprecated: true
      description: |
        **Deprecated.** Accepts the signed hash payload emitted by the old
        Telegram Login Widget and exchanges it for a Wall-Dev session.

        The server verifies the `hash` field using the bot token secret
        (HMAC-SHA256 over the sorted data fields). Prefer the modern
        OAuth2 flow: `GET /auth/oauth/telegram/start`.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramWidgetAuth'
      responses:
        '200':
          description: Successfully authenticated via Telegram Login Widget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Refresh session token
      operationId: authRefresh
      description: |
        Exchanges a valid refresh token for a new access + refresh
        token pair. The old refresh token is invalidated immediately.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/session:
    get:
      tags:
        - Auth
      summary: Introspect current session
      operationId: authSession
      description: |
        Returns information about the current authenticated session
        including token expiry, user identity, active permissions,
        and a list of all active sessions for the current user.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Session information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout current session
      operationId: authLogout
      description: |
        Invalidates the current session token and refresh token.
        The client should discard stored credentials after this call.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Successfully logged out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/session/{sessionId}/logout:
    post:
      tags:
        - Auth
      summary: Logout a specific session
      operationId: authLogoutSession
      description: |
        Remotely invalidates a specific session by its ID. Useful for
        revoking access on a lost or compromised device. Users can only
        target their own sessions unless they have admin privileges.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the session to invalidate.
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Session invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/session/all/logout:
    post:
      tags:
        - Auth
      summary: Logout all sessions except current
      operationId: authLogoutAll
      description: |
        Invalidates all active sessions for the current user **except**
        the session making this request. Equivalent to "log out
        everywhere else."
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All other sessions invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/merge/initiate:
    post:
      tags:
        - Auth
      summary: Initiate account merge (mint merge token for account B)
      operationId: authMergeInitiate
      description: |
        Called while authenticated as account **B** (the account to be absorbed).
        Returns a short-lived, single-use merge token (`scope=merge`,
        `subject=B`) to be submitted by account **A** at
        `POST /users/me/merge`.

        The token expires in ~10 minutes and can only be used once.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Merge token minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeInitiateResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/recover:
    post:
      tags:
        - Auth
      summary: Recover account via mnemonic phrase
      operationId: authRecover
      description: |
        Verifies the 8-word BIP-39-style recovery phrase against the stored
        argon2id hash. On success, mints a **limited-scope recovery session**
        (AuthResponse) that may be used to re-link a provider or site identity,
        but cannot perform other account mutations until a full re-auth.

        No authentication required. Rate-limited aggressively.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverRequest'
      responses:
        '200':
          description: Recovery session minted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /admin/config:
    get:
      tags:
        - Admins
      summary: Get server configuration
      operationId: adminGetConfig
      description: |
        Returns the current server configuration including limits,
        feature flags, and runtime settings.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
        - Admins
      summary: Update server configuration
      operationId: adminUpdateConfig
      description: |
        Partially updates server configuration. Changes take effect
        immediately or after the next request cycle. All changes are
        logged in the audit trail.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServerConfigUpdate'
      responses:
        '200':
          description: Configuration updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/maintenance:
    get:
      tags:
        - Admins
      summary: Get maintenance status
      operationId: adminGetMaintenance
      description: |
        Returns whether the server is in maintenance mode,
        the reason, and estimated end time.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Maintenance status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Admins
      summary: Enable or disable maintenance mode
      operationId: adminSetMaintenance
      description: |
        When enabled, all non-admin requests receive
        `503 Service Unavailable`.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequest'
      responses:
        '200':
          description: Maintenance mode updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/audit:
    get:
      tags:
        - Admins
      summary: Query the admin audit log
      operationId: adminGetAuditLog
      description: |
        Paginated, filterable log of all administrative actions.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Audit log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/shutdown:
    post:
      tags:
        - Admins
      summary: Graceful server shutdown
      operationId: adminShutdown
      description: |
        Initiates a graceful shutdown. **Owner only.**
        Requires confirmation in the request body.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: Shutdown initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/restart:
    post:
      tags:
        - Admins
      summary: Graceful server restart
      operationId: adminRestart
      description: |
        Initiates a graceful restart cycle. **Owner only.**
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: Restart initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/metrics:
    get:
      tags:
        - Admins
      summary: Server metrics (Prometheus-compatible)
      operationId: adminGetMetrics
      description: |
        Returns server performance metrics. Supports Prometheus
        exposition format or JSON depending on `Accept` header.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Server metrics.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/broadcast:
    post:
      tags:
        - Admins
      summary: Send a broadcast notification
      operationId: adminBroadcast
      description: |
        Sends a notification to all users or a filtered subset.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '200':
          description: Broadcast sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userRef}:
    get:
      tags:
        - Admins
      summary: Get full admin view of a user
      operationId: adminGetUser
      description: |
        Returns the complete user record including internal fields,
        all sessions, restrictions, and audit history.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/UserRefPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Full admin user view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserView'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Admins
      summary: Update user info (admin override)
      operationId: adminUpdateUser
      description: |
        Directly modifies user fields bypassing normal validation
        limits. Logged in audit trail.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/UserRefPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdate'
      responses:
        '200':
          description: User updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Admins
      summary: Permanently delete a user
      operationId: adminDeleteUser
      description: |
        Irreversibly removes the user account and all associated data.
        Requires confirmation in the request body.
      parameters:
        - $ref: '#/components/parameters/ClientVersionHeader'
        - $ref: '#/components/parameters/UserRefPath'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: User deleted.
          content:
