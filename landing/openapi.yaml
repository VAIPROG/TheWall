    ServerConfig:
      type: object
      required:
        - maxUsersPerClan
        - maxTemplatesPerUser
        - maxApiKeysPerUser
        - maxFileSizeMb
        - rateLimitPerMinute
        - maintenanceMode
        - featureFlags
        - allowPublicTemplatePublishing
        - autoApproveModeratorTemplates
      properties:
        maxUsersPerClan:
          type: integer
          description: Maximum members allowed per clan.
        maxTemplatesPerUser:
          type: integer
          description: Maximum templates a single user can create.
        maxApiKeysPerUser:
          type: integer
          description: Maximum API keys per user.
        maxFileSizeMb:
          type: integer
          description: Maximum upload file size in megabytes.
        rateLimitPerMinute:
          type: integer
          description: Rate limit per user per minute.
        maintenanceMode:
          type: boolean
          description: Whether maintenance mode is enabled.
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
          description: Dynamic feature flags — keys are feature names, values are enabled/disabled.
        allowPublicTemplatePublishing:
          type: boolean
          description: |
            When true (default), any authenticated user may publish templates with `scope: public`.
            When false, only admin+ may publish public-scope templates; all other users are limited
            to `clan` or `private` scope.
        autoApproveModeratorTemplates:
          type: boolean
          description: |
            When true (default), templates published by a moderator or higher at the relevant scope
            are automatically set to `approved` on creation, bypassing the moderation queue.
            Scope mapping: `public` → global moderator+; `clan` → clan moderator+ of that clan or
            global moderator+; `private` → always approved regardless of this flag.
    ServerConfigUpdate:
      type: object
      properties:
        maxUsersPerClan:
          type: integer
          description: Maximum members allowed per clan.
        maxTemplatesPerUser:
          type: integer
          description: Maximum templates a single user can create.
        maxApiKeysPerUser:
          type: integer
          description: Maximum API keys per user.
        maxFileSizeMb:
          type: integer
          description: Maximum upload file size in megabytes.
        rateLimitPerMinute:
          type: integer
          description: Rate limit per user per minute.
        maintenanceMode:
          type: boolean
          description: Whether maintenance mode is enabled.
        featureFlags:
          type: object
          additionalProperties:
            type: boolean
          description: Dynamic feature flags — keys are feature names, values are enabled/disabled.
        allowPublicTemplatePublishing:
          type: boolean
          description: |
            When true (default), any authenticated user may publish templates with `scope: public`.
            When false, only admin+ may publish public-scope templates; all other users are limited
            to `clan` or `private` scope.
        autoApproveModeratorTemplates:
          type: boolean
          description: |
            When true (default), templates published by a moderator or higher at the relevant scope
            are automatically set to `approved` on creation, bypassing the moderation queue.
            Scope mapping: `public` → global moderator+; `clan` → clan moderator+ of that clan or
            global moderator+; `private` → always approved regardless of this flag.
