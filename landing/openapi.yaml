        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      responses:
        '200':
          description: Pending templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplatePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /moderation/queue/{templateId}/approve:
    post:
      tags:
        - Moderation
      summary: Approve a template
      operationId: approveTemplate
      parameters:
